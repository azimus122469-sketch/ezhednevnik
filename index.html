<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FBF9F3">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Ежедневник">
<meta name="mobile-web-app-capable" content="yes">
<title>Ежедневник</title>
<style>
  :root{
    --paper:#FBF9F3; --paper-2:#F3F0E7; --grid:#DCE5EE; --rule:#C0453C;
    --ink:#16202B; --ink-soft:#5C6875; --ink-faint:#98A1AC;
    --blue:#1F3A93; --teal:#0F766E; --green:#1E7A54; --amber:#A96A15; --red:#B23A32; --violet:#6B3FA0;
    --edge:#E2DDD1; --card:#FFFFFF; --card-2:#FCFBF7; --dr-bg:#FFF4F2; --dr-bd:#E9B8B3;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    --serif:Georgia,"Times New Roman",serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.4;
       padding-bottom:calc(96px + env(safe-area-inset-bottom))}
  body.auth{padding-bottom:24px}
  .sheet-paper{background-image:
      linear-gradient(var(--grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size:22px 22px;background-position:-1px -1px}
  .wrap{max-width:620px;margin:0 auto;padding:0 14px}
  body.wide .wrap{max-width:100%;padding:0 20px}
  body.wide .tabbar{max-width:100%}

  header{position:sticky;top:0;z-index:30;background:var(--paper);border-bottom:1px solid var(--edge)}
  header[hidden]{display:none}

  .purse{display:flex;gap:12px;align-items:flex-start;padding:12px 0 8px}
  .purse-left{flex:0 0 118px;min-width:0;padding-right:12px;border-right:1px solid var(--edge)}
  .purse-right{flex:1 1 auto;min-width:0}
  .purse-label{font-size:12px;color:var(--ink-faint);margin-bottom:3px}
  .rate-num{font-size:15px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.15}
  .rate-sub{font-size:11px;color:var(--ink-faint);margin-bottom:10px;line-height:1.3}
  .total-num{font-family:var(--serif);font-size:21px;line-height:1.05;font-weight:700;cursor:pointer;word-break:break-word}
  .total-num.neg{color:var(--red)}
  .total-sub{font-size:11px;color:var(--ink-faint);margin-top:3px;line-height:1.3}
  .prow{display:flex;justify-content:space-between;align-items:center;gap:8px;
        padding:4px 6px;border-bottom:1px solid var(--grid);cursor:pointer;border-radius:6px}
  .prow:last-child{border-bottom:none}
  .prow.on{background:var(--paper-2)}
  .prow span{font-size:12.5px;color:var(--ink-soft);white-space:nowrap;display:flex;align-items:center;gap:6px}
  .prow b{font-size:14px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
  .prow b.neg{color:var(--red)}
  .ico{flex:0 0 auto;display:inline-block;vertical-align:middle}

  .dayhead{padding:9px 12px 8px;background:var(--paper-2);border-bottom:1px solid var(--grid);border-top:1px solid var(--edge)}
  .dayhead:first-of-type{border-top:none}
  .dh-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
  .dh-date{font-size:13px;font-weight:700}
  .dh-flow{font-size:12px;color:var(--ink-soft);font-variant-numeric:tabular-nums;text-align:right}
  .dh-flow b{font-weight:700}
  .dh-wal{display:grid;grid-template-columns:1fr 1fr;gap:3px 10px;margin-top:6px;font-size:11.5px;color:var(--ink-soft);
          font-variant-numeric:tabular-nums}
  .dh-wal span{display:flex;align-items:center;gap:4px;white-space:nowrap;min-width:0}
  .dh-wal b{margin-left:auto}
  .dh-wal b{color:var(--ink);font-weight:600}
  .dh-wal b.neg{color:var(--red)}
  .conv-row .r-sum{font-size:13.5px;white-space:nowrap;gap:5px}
  .conv-arrow{color:var(--ink-faint);font-weight:400}
  .r-fx{font-size:11.5px;margin-top:2px;color:var(--ink-faint)}
  .r-fx b{font-weight:700}
  .fx-up{color:var(--green)}.fx-down{color:var(--red)}

  .conv-pickrow{display:flex;gap:8px;align-items:center}
  .conv-pickrow .picker{flex:1}
  .conv-sum{margin:2px 0 14px;padding:10px 12px;border:1px dashed var(--edge);border-radius:9px;
            font-size:14px;background:var(--card);font-variant-numeric:tabular-nums}

  .chart-box{position:relative}
  .chart-box svg{display:block;width:100%;height:auto;overflow:visible}
  .chart-note{font-size:12px;color:var(--ink-soft);margin-top:8px}
  .legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:12px;color:var(--ink-soft)}
  .legend span{display:flex;align-items:center;gap:5px}
  .legend i{width:10px;height:10px;border-radius:2px;display:inline-block}
  .chart-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:10px}
  .chart-head h2{margin:0}
  .chart-delta{font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}
  .chart-delta.up{color:var(--green)}.chart-delta.down{color:var(--red)}
  .tip{min-height:18px;font-size:12.5px;color:var(--ink);margin-top:8px;font-variant-numeric:tabular-nums}
  .bar-hit{cursor:pointer}
  .selfbar i{background:var(--teal)}
  .selfnote{font-size:12px;color:var(--ink-soft);margin-top:10px}

  .sync{font-size:12px;color:var(--ink-faint);padding-bottom:8px;display:flex;align-items:center;gap:6px}
  .sync.warn{color:var(--amber)}
  .sync.err{color:var(--red)}
  .sync .wbtn{margin-left:auto;border:1px solid var(--edge);background:var(--card);border-radius:7px;
              padding:3px 8px;font-size:11.5px;font-family:inherit;color:var(--ink-soft);cursor:pointer}
  .month{display:flex;align-items:center;gap:6px;padding-bottom:10px}
  .month b{font-family:var(--serif);font-size:17px;font-weight:700;min-width:150px}
  .mbtn{border:1px solid var(--edge);background:var(--card);color:var(--ink);width:30px;height:30px;
        border-radius:8px;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center}
  .mbtn:active{background:var(--paper-2)}
  .chips{display:flex;gap:6px;overflow-x:auto;padding:0 0 10px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;border:1px solid var(--edge);background:var(--card);border-radius:9px;padding:6px 10px;
        cursor:pointer;font-size:13px;display:flex;align-items:baseline;gap:6px;color:var(--ink-soft);font-family:inherit}
  .chip b{font-size:13.5px;font-variant-numeric:tabular-nums}
  .chip.on{background:var(--paper-2)}
  .dot{width:7px;height:7px;border-radius:50%;display:inline-block;flex:0 0 auto;align-self:center}

  main{padding-top:12px}
  .ledger{border:1px solid var(--edge);border-radius:10px;overflow:hidden;background:var(--card)}
  .lhead{display:flex;padding:8px 12px;font-size:12px;color:var(--ink-faint);border-bottom:1px solid var(--rule)}
  .lhead .c1{flex:0 0 52px}.lhead .c2{flex:1 1 auto}.lhead .c3{flex:0 0 88px;text-align:right}
  .row{display:flex;align-items:center;gap:10px;padding:9px 12px;border-bottom:1px solid var(--grid);cursor:pointer}
  .row:last-child{border-bottom:none}
  .row:active{background:var(--paper-2)}
  .r-date{flex:0 0 42px;font-size:12.5px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
  .r-mid{flex:1 1 auto;min-width:0}
  .r-sum{font-size:15.5px;font-weight:700;font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:6px}
  .r-note{font-size:12.5px;color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .r-meta{font-size:11px;color:var(--ink-faint);margin-top:1px}
  .r-bal{flex:0 0 82px;text-align:right;font-size:14px;font-variant-numeric:tabular-nums;color:var(--ink-soft)}
  .r-bal.neg{color:var(--red)}
  .pending{color:var(--amber)}
  .zero{color:var(--ink-faint);font-weight:400}
  .empty{padding:34px 18px;text-align:center;color:var(--ink-soft);font-size:14px}
  .empty b{display:block;font-family:var(--serif);font-size:18px;color:var(--ink);margin-bottom:6px;font-weight:700}

  .gridwrap{overflow-x:auto;border:1px solid var(--edge);border-radius:10px;background:var(--card)}
  table{border-collapse:collapse;width:100%;min-width:640px;font-size:13px}
  th,td{padding:8px 10px;text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
  th:first-child,td:first-child{text-align:left}
  thead th{font-size:11.5px;color:var(--ink-faint);font-weight:600;border-bottom:1px solid var(--rule);
           position:sticky;top:0;background:var(--card)}
  tbody td{border-bottom:1px solid var(--grid)}
  tbody tr:nth-child(even) td{background:var(--card-2)}
  td.bal{font-weight:700;color:var(--green)}
  td.bal.neg{color:var(--red)}
  tfoot td{border-top:1px solid var(--rule);font-weight:700}

  .block{border:1px solid var(--edge);border-radius:10px;background:var(--card);padding:14px;margin-bottom:12px}
  .block h2{font-family:var(--serif);font-size:17px;margin:0 0 12px;font-weight:700}
  .stat{margin-bottom:14px}.stat:last-child{margin-bottom:0}
  .stat-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:14px}
  .stat-name{display:flex;align-items:center;gap:7px}
  .stat-val{font-weight:700;font-variant-numeric:tabular-nums}
  .bar{height:5px;border-radius:3px;background:var(--paper-2);margin-top:6px;overflow:hidden}
  .bar i{display:block;height:100%;border-radius:3px}
  .stat-sub{font-size:12px;color:var(--ink-soft);margin-top:5px}
  .kv{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--grid);font-size:14px}
  .kv:last-child{border-bottom:none}
  .kv span{color:var(--ink-soft)}
  .kv b{font-variant-numeric:tabular-nums}
  .diff-ok{color:var(--green)}.diff-bad{color:var(--red)}

  label{display:block;font-size:12.5px;color:var(--ink-soft);margin:0 0 5px}
  input,select{width:100%;font-family:inherit;font-size:16px;color:var(--ink);background:var(--card);
    border:1px solid var(--edge);border-radius:9px;padding:11px 12px;outline:none}
  input:focus,select:focus{border-color:var(--blue)}
  .field{margin-bottom:12px}
  .two{display:flex;gap:10px}.two>*{flex:1 1 0;min-width:0}
  .btn{width:100%;border:none;border-radius:10px;padding:13px;font-size:15px;font-weight:600;
       font-family:inherit;background:var(--ink);color:var(--paper);cursor:pointer}
  .btn:active{opacity:.85}
  .btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--edge)}
  .btn.danger{background:var(--card);color:var(--red);border:1px solid var(--edge)}
  .btn+.btn{margin-top:8px}
  .picker{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
  .picker.two-col{grid-template-columns:repeat(2,1fr)}
  .pick{border:1px solid var(--edge);background:var(--card);border-radius:9px;padding:9px 6px;font-size:13px;
        font-family:inherit;color:var(--ink-soft);cursor:pointer;display:flex;flex-direction:column;
        align-items:center;gap:5px}
  .pick.on{border-width:2px;padding:8px 5px;color:var(--ink);font-weight:600;background:var(--paper-2)}
  .quick{display:flex;gap:6px;margin-top:8px}
  .quick button{flex:1;border:1px solid var(--edge);background:var(--card);border-radius:9px;padding:9px 4px;
                font-size:13px;font-family:inherit;color:var(--ink);cursor:pointer}
  .quick button:active{background:var(--paper-2)}
  .hint{font-size:12px;color:var(--ink-soft);margin-top:-4px;margin-bottom:12px}
  .err{font-size:13px;color:var(--red);margin-bottom:12px}

  .goal{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--grid);cursor:pointer}
  .goal:last-child{border-bottom:none}
  .gbox{flex:0 0 18px;height:18px;border:2px solid var(--ink-faint);border-radius:5px;margin-top:2px;
        display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff}
  .gbox.done{background:var(--green);border-color:var(--green)}
  .gmid{flex:1 1 auto;min-width:0}
  .gtitle{font-size:14.5px}
  .gtitle.done{color:var(--ink-faint);text-decoration:line-through}
  .gdue{font-size:12px;color:var(--ink-soft);margin-top:2px}
  .gdue.late{color:var(--red);font-weight:600}
  .gdue.soon{color:var(--amber)}
  .goalwrap{border-bottom:1px solid var(--grid)}
  .goalwrap:last-child{border-bottom:none}
  .goalwrap .goal{border-bottom:none}
  .gprog{height:5px;background:var(--grid);border-radius:3px;margin-top:6px;overflow:hidden}
  .gprog i{display:block;height:100%;background:var(--green)}
  .gsteps{margin:0 0 8px 28px}
  .step{display:flex;gap:9px;align-items:flex-start;padding:7px 0;border-top:1px dashed var(--grid);cursor:pointer}
  .step:first-child{border-top:none}
  .sbox{flex:0 0 17px;height:17px;border:2px solid var(--ink-faint);border-radius:50%;margin-top:1px;color:#fff;font-size:10px;line-height:13px;text-align:center}
  .sbox.done{background:var(--green);border-color:var(--green)}
  .stitle{font-size:13.5px}
  .stitle.done{color:var(--ink-faint);text-decoration:line-through}
  .sdue{font-size:11.5px;color:var(--ink-soft);margin-top:1px}
  .sdue.late{color:var(--red);font-weight:600}
  .glink{font-size:12.5px;color:var(--blue);background:none;border:none;padding:6px 0;cursor:pointer;font-weight:600}
  .debt-sum{display:flex;justify-content:space-between;padding:6px 0;font-size:14px}
  .debt-sum b{font-variant-numeric:tabular-nums}

  .tabbar{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--paper);
    border-top:1px solid var(--edge);padding:8px 10px calc(8px + env(safe-area-inset-bottom));
    display:flex;gap:5px;max-width:620px;margin:0 auto}
  .tabbar[hidden]{display:none}
  .tab{flex:1 1 0;border:1px solid transparent;background:transparent;border-radius:9px;padding:9px 2px;
       font-size:12.5px;font-family:inherit;color:var(--ink-soft);cursor:pointer;white-space:nowrap}
  .tab.on{background:var(--card);border-color:var(--edge);color:var(--ink);font-weight:600}
  .add{flex:0 0 44px;background:var(--ink);color:var(--paper);border:none;border-radius:9px;
       font-size:23px;line-height:1;cursor:pointer}

  .aiList{margin:8px 0 12px;display:flex;flex-direction:column;gap:8px}
  .cb{max-width:88%;padding:8px 11px;border-radius:12px;font-size:14.5px;line-height:1.35;border:1px solid var(--edge);background:var(--card);word-break:break-word}
  .cb.me{align-self:flex-end;background:var(--paper-2)}
  .cb.bot{align-self:flex-start}
  .cb-time{font-size:10.5px;color:var(--ink-faint);margin-top:3px;text-align:right}
  .cb-day{align-self:center;font-size:11px;color:var(--ink-faint);margin:4px 0}
  .cb-act{margin-top:7px;padding-top:7px;border-top:1px dashed var(--edge);font-size:13.5px}
  .cb-act.first{margin-top:0;padding-top:0;border-top:none}
  .cb-sum{margin-bottom:6px}
  .cb-st{font-size:12.5px;font-weight:600}
  .cb-st.ok{color:var(--green)}.cb-st.no{color:var(--ink-faint)}.cb-st.bad{color:var(--red)}
  .abtns{display:flex;gap:8px}
  .abtns button{flex:1;border-radius:9px;padding:9px;font-size:14px;font-weight:600;font-family:inherit;cursor:pointer;border:1px solid var(--edge);background:var(--card);color:var(--ink)}
  .abtns button.ok{background:var(--green);border-color:var(--green);color:#fff}
  .abtns button:disabled{opacity:.5}
  textarea{width:100%;font-family:inherit;font-size:16px;color:var(--ink);background:var(--card);border:1px solid var(--edge);border-radius:9px;padding:11px 12px;outline:none;resize:vertical;margin-bottom:8px}
  textarea:focus{border-color:var(--blue)}
  .badge{display:inline-block;min-width:15px;height:15px;line-height:15px;border-radius:8px;background:var(--red);color:#fff;font-size:10px;font-weight:700;margin-left:4px;padding:0 4px;vertical-align:top}
  .badge[hidden]{display:none}
  .tokrow{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--grid);font-size:13.5px}
  .tokrow:last-child{border-bottom:none}
  .tokrow .tn{flex:1 1 auto;min-width:0}
  .tokrow .tm{font-size:11.5px;color:var(--ink-faint)}
  .tokrow button{flex:0 0 auto;border:1px solid var(--edge);background:var(--card);color:var(--red);border-radius:8px;padding:6px 10px;font-size:12.5px;font-family:inherit;cursor:pointer}
  .tokbox{border:1px solid var(--amber);border-radius:9px;padding:10px;margin:10px 0;background:var(--paper-2);font-size:13px}
  .mono{font-family:ui-monospace,Menlo,monospace;font-size:12px;word-break:break-all;margin:6px 0}

  .scrim{position:fixed;inset:0;background:rgba(22,32,43,.42);z-index:50;display:flex;
         align-items:flex-end;justify-content:center}
  .scrim[hidden]{display:none}
  .modal{width:100%;max-width:620px;background:var(--paper);border-radius:16px 16px 0 0;
    padding:16px 16px calc(16px + env(safe-area-inset-bottom));max-height:92vh;overflow-y:auto}
  .modal h3{font-family:var(--serif);font-size:19px;margin:0 0 14px;font-weight:700}
  .mclose{float:right;border:none;background:transparent;font-size:22px;color:var(--ink-soft);cursor:pointer;padding:0 4px}
  .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:86px;z-index:60;background:var(--ink);
         color:var(--paper);padding:10px 16px;border-radius:9px;font-size:13.5px;max-width:88%}
  .toast[hidden]{display:none}

  .signin{max-width:400px;margin:0 auto;padding:56px 16px 24px}
  .signin h1{font-family:var(--serif);font-size:30px;margin:0 0 6px;font-weight:700}
  .signin p.lead{color:var(--ink-soft);font-size:14px;margin:0 0 24px}
  .signin .block{background:var(--card)}
  .swap{background:none;border:none;color:var(--blue);font-family:inherit;font-size:13.5px;
        cursor:pointer;padding:10px 0 0;width:100%}

  /* черновики */
  .draftbar{display:flex;flex-wrap:wrap;gap:6px;padding-top:10px}
  .draftbar[hidden]{display:none}
  .dchip{display:flex;align-items:center;gap:7px;max-width:100%;border:1px solid var(--dr-bd);background:var(--dr-bg);border-radius:10px;
         padding:6px 8px 6px 10px;font:inherit;font-size:13px;color:var(--ink);cursor:pointer;text-align:left}
  .dchip .dlab{color:var(--red);font-weight:700;font-size:12px;flex:0 0 auto}
  .dchip .dtx{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .dchip .dx{flex:0 0 auto;color:var(--ink-faint);font-style:normal;font-size:17px;line-height:1;padding:0 2px}
  .draftnote{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:-6px 0 12px;padding:7px 10px;border-radius:9px;
             background:var(--dr-bg);border:1px solid var(--dr-bd);font-size:12.5px;color:var(--red)}
  .draftnote button{border:none;background:transparent;color:var(--ink-soft);font:inherit;font-size:12.5px;text-decoration:underline;cursor:pointer;padding:0}
  .add{position:relative}
  .add.hasdraft::after{content:"";position:absolute;top:5px;right:5px;width:9px;height:9px;border-radius:50%;background:#E5483B;border:2px solid var(--ink)}

  /* виды тетради */
  .bseg{display:inline-flex;border:1px solid var(--edge);border-radius:9px;overflow:hidden;background:var(--card)}
  .bseg button{border:none;background:transparent;padding:7px 11px;font:inherit;font-size:13px;color:var(--ink-soft);cursor:pointer;white-space:nowrap}
  .bseg button.on{background:var(--ink);color:var(--paper)}
  .gt{min-width:560px}
  .gt thead th{background:var(--card);border-top:3px solid var(--tc,transparent)}
  .gt thead th:first-child,.gt thead th:last-child{border-top-color:transparent}
  .gt.ta th:last-child,.gt.ta td.bal{position:sticky;right:0;background:var(--card);box-shadow:-6px 0 6px -6px rgba(0,0,0,.18)}
  .gt.ta tr.opening td.bal,.gt.ta tr.sum td.bal{background:var(--paper-2)}
  .gt td.dd{font-size:13px}
  .gt td.dd b{font-size:15px;font-family:var(--serif)}

   Это только показ: на остатки кошельков и на приход/расход не влияет. null, если учётного курса нет. */
function fxDiff(fromCur,give,get,book){
  if(!(book>0) || !(give>0) || !(get>0)) return null;
  return fromCur==="USD" ? get-give*book : get*book-give;
}

  if(wo.cur===wi.cur) return null;
  return fxDiff(wo.cur,e.out.amount,e.inn.amount,e.book);
}

/* ---------- сеть ---------- */
async function authFetch(path, opts){
  const o = opts||{};
  const r = await fetch(SUPABASE_URL+path, {
    method:o.method||"GET",
    headers:Object.assign({apikey:SUPABASE_KEY,"Content-Type":"application/json"}, o.headers||{}),
    body:o.body?JSON.stringify(o.body):undefined
  });
  const text = await r.text();
  let data=null; try{ data = text?JSON.parse(text):null; }catch(e){ data=text; }
  if(!r.ok){
    const msg=(data&&(data.error_description||data.msg||data.message||data.error))||("Ошибка "+r.status);
    const err=new Error(msg); err.status=r.status; err.data=data; throw err;
  }
  return data;
}
async function api(path, opts){
  await ensureToken();
  const o=opts||{};
  o.headers=Object.assign({Authorization:"Bearer "+session.access_token}, o.headers||{});
  try{ return await authFetch(path,o); }
  catch(e){
    if(e.status===401){ await refreshToken(); o.headers.Authorization="Bearer "+session.access_token;
      return await authFetch(path,o); }
    throw e;
  }
}
async function ensureToken(){
  if(!session) throw new Error("Нет входа");
  if(session.expires_at && Date.now() > session.expires_at-60000) await refreshToken();
}
async function refreshToken(){
  const d=await authFetch("/auth/v1/token?grant_type=refresh_token",
    {method:"POST", body:{refresh_token:session.refresh_token}});
  saveSession(d);
}
function saveSession(d){
  session={ access_token:d.access_token, refresh_token:d.refresh_token,
    expires_at:Date.now()+(d.expires_in||3600)*1000,
    email:(d.user&&d.user.email)||(session&&session.email)||"",
    user_id:(d.user&&d.user.id)||(session&&session.user_id)||"" };
  LS.set(K_SESSION, JSON.stringify(session));
}
async function signIn(email,password){
  saveSession(await authFetch("/auth/v1/token?grant_type=password",{method:"POST",body:{email,password}}));
}
async function signUp(email,password){
  const d=await authFetch("/auth/v1/signup",{method:"POST",body:{email,password}});
  if(d&&d.access_token){ saveSession(d); return true; }
  return false;
}
function signOut(){
  session=null; LS.del(K_SESSION); LS.del(K_CACHE); LS.del(K_QUEUE); DR={}; LS.del(K_DRAFTS);

function cacheSave(){ LS.set(K_CACHE, JSON.stringify({entries:S.entries, goals:S.goals, steps:S.steps, debts:S.debts, settings:S.settings})); }
function cacheLoad(){
  try{ const d=JSON.parse(LS.get(K_CACHE)||"null");
    if(d&&Array.isArray(d.entries)){ S.entries=d.entries; S.goals=d.goals||[]; S.steps=d.steps||[]; S.debts=d.debts||[];
      if(d.settings) S.settings=Object.assign(S.settings,d.settings); return true; }
  }catch(e){}
  return false;
}
function queueSave(){ LS.set(K_QUEUE, JSON.stringify(queue)); }
function queueLoad(){ try{ queue=JSON.parse(LS.get(K_QUEUE)||"[]")||[]; }catch(e){ queue=[]; } }
function enqueue(op){ queue.push(op); queueSave(); }
function isPending(id){ return queue.some(q => q.id===id); }

/* ---------- загрузка ---------- */
function normEntry(e){
  return { id:e.id, date:e.date, col:e.col, amount:Number(e.amount), cur:e.cur,
           wallet:e.wallet||"cash_uzs", note:e.note||"", source:e.source||"user",
           conv_id:e.conv_id||null, rate:(e.rate==null?null:Number(e.rate)),
           book_rate:(e.book_rate==null?null:Number(e.book_rate)),
           created_at:e.created_at||"", updated_at:e.updated_at||e.created_at||"" };
}
function normGoal(g){
  return { id:g.id, title:g.title, due:g.due||"", done:!!g.done, notify:g.notify!==false,
           source:g.source||"user", created_at:g.created_at||"", updated_at:g.updated_at||"" };
}
function normStep(x){
  return { id:x.id, goal_id:x.goal_id||null, debt_id:x.debt_id||null, title:x.title, amount:(x.amount==null?null:Number(x.amount)), cur:x.cur||null,
           due:x.due||"", done:!!x.done, done_at:x.done_at||null, pos:Number(x.pos)||0, source:x.source||"user",
           created_at:x.created_at||"", updated_at:x.updated_at||x.created_at||"" };
}
function normDebt(x){
  return { id:x.id, kind:x.kind==="owed"?"owed":"owe", person:x.person||"", amount:Number(x.amount)||0, cur:x.cur||"UZS",
           paid:Number(x.paid)||0, due:x.due||"", note:x.note||"", source:x.source||"user",
           created_at:x.created_at||"", updated_at:x.updated_at||x.created_at||"" };
}
async function pullAll(){
  const rows = await api("/rest/v1/entries?select=*&order=date.asc,created_at.asc");
  S.entries = (rows||[]).map(normEntry);
  const gs = await api("/rest/v1/goals?select=*&order=due.asc");
  S.goals = (gs||[]).map(normGoal);
  try{ const ss=await api("/rest/v1/goal_steps?select=*&order=pos.asc,due.asc"); S.steps=(ss||[]).map(normStep); }catch(e){}
  try{ const ds=await api("/rest/v1/debts?select=*&order=created_at.asc"); S.debts=(ds||[]).map(normDebt); }catch(e){}
  const st = await api("/rest/v1/settings?select=*&limit=1");
  if(st && st.length){
    const s=st[0];
    S.settings = { starts:s.starts||{}, base:s.base_cur||"USD", rate:Number(s.rate)||12600,
      rateSource:s.rate_source||"cbu", notifyTime:s.notify_time||"21:00", checks:s.checks||{},
      payPct:Number(s.pay_pct)||10, payBase:s.pay_base||"all",
      aiModel:s.ai_model==="terra"?"terra":"luna", aiLimit:s.ai_daily_limit==null?1:Number(s.ai_daily_limit) };
  } else { await pushSettings(); }
  cacheSave();
}
async function pushSettings(){
  const s=S.settings;
  await api("/rest/v1/settings",{ method:"POST",
    body:[{ user_id:session.user_id, starts:s.starts, base_cur:s.base, rate:s.rate,
            rate_source:s.rateSource, notify_time:s.notifyTime, checks:s.checks,
            pay_pct:s.payPct||10, pay_base:s.payBase||"all",
            start_amount:0, start_cur:"USD" }],
    headers:{Prefer:"resolution=merge-duplicates,return=minimal"} });
}
async function flushQueue(){
  if(!queue.length || !session) return;
  const rest=[];
  for(const op of queue){
    try{
      if(op.kind==="insert")
        await api("/rest/v1/entries",{method:"POST",body:[op.row],
          headers:{Prefer:"resolution=merge-duplicates,return=minimal"}});
      else if(op.kind==="update")
        await api("/rest/v1/entries?id=eq."+op.id,{method:"PATCH",body:op.row,
          headers:{Prefer:"return=minimal"}});
      else if(op.kind==="delete")
        await api("/rest/v1/entries?id=eq."+op.id,{method:"DELETE",headers:{Prefer:"return=minimal"}});
      else if(op.kind==="goal_insert")
        await api("/rest/v1/goals",{method:"POST",body:[op.row],
          headers:{Prefer:"resolution=merge-duplicates,return=minimal"}});
      else if(op.kind==="goal_update")
        await api("/rest/v1/goals?id=eq."+op.id,{method:"PATCH",body:op.row,
          headers:{Prefer:"return=minimal"}});
      else if(op.kind==="goal_delete")
        await api("/rest/v1/goals?id=eq."+op.id,{method:"DELETE",headers:{Prefer:"return=minimal"}});
      else if(/^(step|debt)_(insert|update|delete)$/.test(op.kind)){
        const tb = op.kind.startsWith("step") ? "goal_steps" : "debts", act = op.kind.split("_")[1];
        if(act==="insert") await api("/rest/v1/"+tb,{method:"POST",body:[op.row],
          headers:{Prefer:"resolution=merge-duplicates,return=minimal"}});
        else if(act==="update") await api("/rest/v1/"+tb+"?id=eq."+op.id,{method:"PATCH",body:op.row,
          headers:{Prefer:"return=minimal"}});
        else await api("/rest/v1/"+tb+"?id=eq."+op.id,{method:"DELETE",headers:{Prefer:"return=minimal"}});
      }
      else if(op.kind==="settings") await pushSettings();
    }catch(e){
      if(e.status && e.status>=400 && e.status<500 && e.status!==401 && e.status!==429) continue;
      rest.push(op);
    }
  }
  queue=rest; queueSave();
}
async function sync(){
  if(!session || ui.syncing) return;
  ui.syncing=true; ui.lastError=null; renderSync();
  try{ await flushQueue(); await pullAll(); await aiPull(); }
  catch(e){ ui.lastError=e.message||"нет связи"; }
  ui.syncing=false; render(); checkReminders();
}

/* ---------- курс ЦБ ---------- */
async function fetchCbuRate(){
  if(S.settings.rateSource!=="cbu") return;
  try{
    let v=NaN;
    /* сначала через функцию Supabase (браузер часто блокирует cbu.uz напрямую), потом напрямую */
    try{
      const r=await fetch(SUPABASE_URL+"/functions/v1/cbu-rate");
      if(r.ok){ const d=await r.json(); if(d&&d.ok) v=Number(d.rate); }
    }catch(e){}
    if(!(v>0)){
      const r=await fetch("https://cbu.uz/ru/arkhiv-kursov-valyut/json/USD/");
      if(!r.ok) return;
      const d=await r.json();
      v=Array.isArray(d)&&d[0]?parseFloat(d[0].Rate):NaN;
    }
    if(isFinite(v)&&v>0 && Math.abs(v-S.settings.rate)>0.5){
      S.settings.rate=v; cacheSave(); enqueue({kind:"settings"}); flushThen(); render();
    }
  }catch(e){}
}

/* ---------- деньги ---------- */
function toBase(amount,cur){
  const s=S.settings;
  if(cur===s.base) return amount;
  if(s.base==="USD"&&cur==="UZS") return amount/(s.rate||1);
  if(s.base==="UZS"&&cur==="USD") return amount*(s.rate||1);
  return amount;
}
/* курс записи: сумов за $1 на дату записи; нет курса: берём курс из шапки */
function eRate(e){ const r=Number(e&&e.book_rate); return r>0?r:(S.settings.rate||1); }
function convBase(amount,cur,rate){
  const b=S.settings.base;
  if(cur===b) return amount;
  if(b==="USD"&&cur==="UZS") return amount/(rate||1);
  if(b==="UZS"&&cur==="USD") return amount*(rate||1);
  return amount;
}
function eBase(e){ return convBase(Number(e.amount), walletById(e.wallet).cur, eRate(e)); }
function fmt(n,cur){
  const c=cur||S.settings.base, v=Math.abs(n);
  let str;
  if(c==="USD") str="$"+(Math.round(v*100)/100).toLocaleString("ru-RU",
    {minimumFractionDigits:(Math.round(v*100)/100)%1?2:0,maximumFractionDigits:2});
  else str=Math.round(v).toLocaleString("ru-RU").replace(/\u00A0/g," ")+" сум";
  return (n<0?"−":"")+str;
}
function fmtNum(n,cur){
  const c=cur||S.settings.base, v=Math.abs(n);
  let str;
  if(c==="USD") str="$"+(Math.round(v*100)/100).toLocaleString("ru-RU",
    {minimumFractionDigits:(Math.round(v*100)/100)%1?2:0,maximumFractionDigits:2});
  else str=Math.round(v).toLocaleString("ru-RU").replace(/\u00A0/g," ");
  return (n<0?"−":"")+str;
}
function fmtShort(n){ return fmtShortCur(n, S.settings.base); }
function fmtShortCur(n,c){
  const a=Math.abs(n);
  let str;
  if(c==="USD") str="$"+(a>=1000?Math.round(a).toLocaleString("ru-RU").replace(/\u00A0/g," ")
    :(Math.round(a*100)/100).toLocaleString("ru-RU"));
  else{
    if(a>=1e6) str=(Math.round(a/1e5)/10).toLocaleString("ru-RU")+" млн";
    else if(a>=1000) str=Math.round(a/1000).toLocaleString("ru-RU").replace(/\u00A0/g," ")+" т";
    else str=String(Math.round(a));
  }
  return (n<0?"−":"")+str;
}
function parseAmount(raw){
  if(raw===0||raw==="0") return {amount:0,cur:null};
  if(!raw) return null;
  let t=String(raw).trim().toLowerCase().replace(/\s+/g,"").replace(/,/g,".");
  let cur=null;
  if(t.includes("$")){ cur="USD"; t=t.replace(/\$/g,""); }
  let mult=1;
  if(/(млн|mln|m)$/.test(t)){ mult=1e6; t=t.replace(/(млн|mln|m)$/,""); }
  else if(/(тыс|т|k|к)$/.test(t)){ mult=1e3; t=t.replace(/(тыс|т|k|к)$/,""); }
  const n=parseFloat(t);
  if(!isFinite(n)) return null;
  return { amount:Math.abs(n)*mult, cur };
}

/* ---------- расчёты ---------- */
function sortedEntries(){
  return S.entries.slice().sort((a,b)=>
    a.date===b.date ? String(a.created_at).localeCompare(String(b.created_at)) : (a.date<b.date?-1:1));
}
function walletBalance(wid){
  const w=walletById(wid);
  let v=Number(S.settings.starts[wid]||0);
  S.entries.forEach(e=>{ if(e.wallet===wid) v+=colById(e.col).sign*e.amount; });
  return v;
}
function totalBase(){
  return WALLETS.reduce((s,w)=>s+toBase(walletBalance(w.id), w.cur), 0);
}
function withRunning(){
  let run=WALLETS.reduce((s,w)=>s+toBase(Number(S.settings.starts[w.id]||0), w.cur),0);
  return sortedEntries().map(e=>{
    run+=colById(e.col).sign*toBase(e.amount, walletById(e.wallet).cur);
    return Object.assign({},e,{run});
  });
}
/* все записи месяца, включая обе половины обмена (для расчётов) */
function rawMonth(ym){ return withRunning().filter(e=>e.date.slice(0,7)===ym); }
/* записи месяца для показа: пара обмена сливается в одну строку */
function monthEntries(ym){
  const raw=rawMonth(ym), out=[], seen={};
  raw.forEach(e=>{
    if(!isConv(e) || !e.conv_id){ out.push(e); return; }
    if(seen[e.conv_id]) return;
    const pair=raw.filter(x=>x.conv_id===e.conv_id);
    const o=pair.find(x=>x.col==="cout"), i=pair.find(x=>x.col==="cin");
    seen[e.conv_id]=true;
    if(o && i) out.push({ conv:true, id:o.id, conv_id:e.conv_id, date:o.date, out:o, inn:i,
      run:raw.indexOf(i)>raw.indexOf(o)?i.run:o.run,
      note:o.note||i.note||"", rate:o.rate||i.rate||null, book:o.book_rate||i.book_rate||null, source:o.source,
      created_at:o.created_at, updated_at:o.updated_at>i.updated_at?o.updated_at:i.updated_at });
    else out.push(e);
  });
  return out;
}
/* обмены не входят ни в приход, ни в расход */
function monthTotals(ym){
  const t={}; COLS.forEach(c=>t[c.id]=0);
  rawMonth(ym).forEach(e=>{ if(isConv(e) || !(e.col in t)) return;
    t[e.col]+=eBase(e); });
  return t;
}
/* по дням: приход, расход (без обменов) и остаток каждого кошелька на конец дня */
function dayMap(){
  const bal={}; WALLETS.forEach(w=>bal[w.id]=Number(S.settings.starts[w.id]||0));
  const days={}, list=sortedEntries();
  list.forEach((e,idx)=>{
    const c=colById(e.col), d=days[e.date]||(days[e.date]={inc:0,spent:0,bal:null});
    bal[e.wallet]=(bal[e.wallet]||0)+c.sign*e.amount;
    if(e.col==="self"){ d.self=(d.self||0)+eBase(e); }
    else if(!isConv(e)){
      const v=eBase(e);
      if(c.sign>0) d.inc+=v; else d.spent+=v;
    }
    const next=list[idx+1];
    if(!next || next.date!==e.date) d.bal=Object.assign({},bal);
  });
  return days;
}
function totalOfBal(bal){ return WALLETS.reduce((s,w)=>s+toBase(bal[w.id]||0,w.cur),0); }
const WD=["вс","пн","вт","ср","чт","пт","сб"];
function dayLabel(iso){
  const d=new Date(iso+"T00:00:00");
  return String(d.getDate()).padStart(2,"0")+" "+MONTHS[d.getMonth()].slice(0,3).toLowerCase()+", "+WD[d.getDay()];
}
function topNotes(ym,colId){
  const map={};
  monthEntries(ym).filter(e=>e.col===colId&&e.note&&e.amount>0).forEach(e=>{
    const k=e.note.trim().toLowerCase();
    map[k]=(map[k]||0)+eBase(e);
  });
  return Object.entries(map).sort((a,b)=>b[1]-a[1]).slice(0,3);
}
function shiftMonth(ym,d){
  let [y,m]=ym.split("-").map(Number);
  m+=d; if(m<1){m=12;y--;} if(m>12){m=1;y++;}
  return y+"-"+String(m).padStart(2,"0");
}
function daysLeft(due){
  if(!due) return null;
  const a=new Date(todayISO()+"T00:00:00"), b=new Date(due+"T00:00:00");
  return Math.round((b-a)/86400000);
}

/* ---------- напоминания ---------- */
async function askNotify(){
  if(!("Notification" in window)) { toast("Устройство не умеет уведомления"); return; }
  const p=await Notification.requestPermission();
  toast(p==="granted"?"Уведомления включены":"Уведомления не разрешены");
  render();
}
function notify(title, body){
  if(!("Notification" in window) || Notification.permission!=="granted") return;
  try{
    if(navigator.serviceWorker && navigator.serviceWorker.ready)
      navigator.serviceWorker.ready.then(r=>r.showNotification(title,{body,icon:"./icon-192.png",tag:"ezh"}));
    else new Notification(title,{body,icon:"./icon-192.png"});
  }catch(e){}
}
function checkReminders(){
  if(!session) return;
  let marks={}; try{ marks=JSON.parse(LS.get(K_NOTIFIED)||"{}"); }catch(e){}
  const today=todayISO();

  const [hh,mm]=(S.settings.notifyTime||"21:00").split(":").map(Number);
  const now=new Date();
  const past = now.getHours()>hh || (now.getHours()===hh && now.getMinutes()>=mm);
  /* считаем запись «за сегодня», если она внесена сегодня, даже на другую дату */
  const hasToday = S.entries.some(e=>e.date===today ||
    (e.created_at && !isNaN(new Date(e.created_at)) && localISO(new Date(e.created_at))===today));
  if(past && !hasToday && marks.day!==today){
    notify("Ежедневник", "За сегодня нет ни одной записи");
    marks.day=today;
  }

  const due = S.goals.filter(g=>!g.done && g.notify && g.due && daysLeft(g.due)<=0);
  if(due.length && marks.goals!==today){
    const late=due.filter(g=>daysLeft(g.due)<0).length;
    notify("Цели", late?("Просрочено целей: "+late):("Сегодня срок: "+due[0].title));
    marks.goals=today;
  }
  LS.set(K_NOTIFIED, JSON.stringify(marks));
}

/* А. Таблица как в Excel: строка на запись, фильтр и сортировка в заголовках, итоги по валютам без пересчёта */
const XKEYS=[["date","Дата","date"],["colName","Статья","set"],["sum","Сумма","num"],["cur","Валюта","set"],
  ["walletName","Кошелёк","set"],["rate","Курс","num"],["note","Заметка","text"],["src","Кто внёс","set"],["wrun","Остаток кошелька","num"]];
function xRows(){
  const bal={}; WALLETS.forEach(w=>bal[w.id]=Number(S.settings.starts[w.id]||0));
  let rows=sortedEntries().map(e=>{
    const c=colById(e.col), w=walletById(e.wallet), v=c.sign*Number(e.amount);
    bal[e.wallet]=(bal[e.wallet]||0)+v;
    return {id:e.id,conv_id:e.conv_id,date:e.date,col:e.col,colName:c.name,color:c.color,sum:v,cur:w.cur,wallet:e.wallet,
            walletName:w.name,rate:Number(e.book_rate)>0?Number(e.book_rate):0,note:e.note||"",src:e.source==="ai"?"помощник":"я",wrun:bal[e.wallet]};
  });
  if(!ui.tblAll) rows=rows.filter(r=>r.date.slice(0,7)===ui.month);
  if(ui.filter!=="all") rows=rows.filter(r=>r.col===ui.filter);
  if(ui.wallet!=="all") rows=rows.filter(r=>r.wallet===ui.wallet);
  return rows;
}
function xApply(rows){
  const f=ui.xf, t={}; XKEYS.forEach(k=>t[k[0]]=k[2]);
  rows=rows.filter(r=>{
    for(const k in f){ const x=f[k], v=r[k];
      if(t[k]==="set" && x.ex && x.ex.includes(String(v))) return false;
      if(t[k]==="num"){ if(x.min!=null && v<x.min) return false; if(x.max!=null && v>x.max) return false; }
      if(t[k]==="date"){ if(x.from && v<x.from) return false; if(x.to && v>x.to) return false; }
      if(t[k]==="text" && x.q && !String(v).toLowerCase().includes(x.q.toLowerCase())) return false;
    }
    return true;
  });
  const o=ui.xs;
  if(o) rows=rows.slice().sort((a,b)=>{ const x=a[o.k], y=b[o.k];
    return ((typeof x==="number")?x-y:String(x).localeCompare(String(y),"ru"))*o.dir; });
  return rows;
}

      body+= Math.abs(v)<0.005 ? '<td class="nul'+(r.filter?' cl':'')+'" '+(r.filter?'data-f="'+r.filter+'"':'')+'>·</td>'
        : '<td class="'+(r.filter?'cl':'')+'" '+(r.filter?'data-f="'+r.filter+'"':'')+' style="color:'+(r.sum?'inherit':r.color)+'">'+fmtShort(v)+'</td>'; });
    body+='<td style="font-weight:700;color:'+(r.profit&&m<0?"var(--red)":"inherit")+'">'+fmtShort(m)+'</td>';

    }else body+='<td class="nul">·</td>';

      body+='<td class="'+(dp===0?"nul":good?"dlt-up":"dlt-dn")+'">'+(dp>0?"+":"")+dp+'%</td>'; }
    body+='</tr>';
  });
  const wrap=document.createElement("div"); wrap.className="gridwrap";
  wrap.innerHTML='<table class="gt" style="min-width:720px"><thead>'+head+'</thead><tbody>'+body+'</tbody></table>';

  box.appendChild(note); return box;
}

/* В. Карта месяца: календарь, цвет клетки = сколько потрачено (или заработано) за день */
function gridC(listAll){
  const ym=ui.month, N=daysInMonth(ym), first=wdIdx(ym+"-01"), days=aggDays(listAll);
  const mode=ui.hm==="in"?"in":"out", col=mode==="in"?"--green":"--red";

  const mx=Math.max(1,...Object.values(days).map(val));

  const top=document.createElement("div"); top.className="hm-top";
  top.innerHTML='<b style="font-family:var(--serif);font-size:16px">'+(mode==="in"?"Сколько заработано по дням":"Сколько потрачено по дням")+'</b>';

  [["out","Расходы"],["in","Приход"]].forEach(([k,t])=>{ const x=document.createElement("button"); x.textContent=t; x.className=mode===k?"on":"";
    x.onclick=()=>{ ui.hm=k; render(); }; sg.appendChild(x); });
  top.appendChild(sg); box.appendChild(top);
  const cal=document.createElement("div"); cal.className="cal";
  WDM.forEach(w=>{ const h=document.createElement("div"); h.className="wh"; h.textContent=w; cal.appendChild(h); });
  for(let i=0;i<first;i++){ const e=document.createElement("div"); e.className="hc blank"; cal.appendChild(e); }
  const today=todayISO();
  for(let d=1;d<=N;d++){
    const iso=ym+"-"+String(d).padStart(2,"0"), a=days[iso], v=val(a);
    const c=document.createElement("div");
    c.className="hc"+(a?"":" emp")+(iso===today?" today":"");
    if(v>0) c.style.background="color-mix(in srgb, var("+col+") "+Math.round(12+v/mx*60)+"%, var(--card))";
    c.innerHTML='<i>'+d+'</i><b>'+(v>0?fmtShort(v):(a?"·":""))+'</b>';
    if(a) c.onclick=()=>openDay(iso);
    cal.appendChild(c);
  }
  box.appendChild(cal);
  // итоги карты
  const ds=Object.values(days), M=sumsOf(listAll);
  const elapsed = ym===ymNow() ? parseInt(todayISO().slice(8,10),10) : N;
  const top1=ds.slice().sort((x,y)=>y.spent-x.spent)[0], best=ds.slice().sort((x,y)=>y.inc-x.inc)[0];
  const empty=Array.from({length:elapsed},(_,i)=>ym+"-"+String(i+1).padStart(2,"0")).filter(k=>!days[k]).length;
  const dl=iso=>parseInt(iso.slice(8,10),10)+" "+MONTHS_GEN[parseInt(iso.slice(5,7),10)-1];
  const st=document.createElement("div"); st.className="stats";
  const stat=(l,v)=>'<div class="stat"><small>'+l+'</small><b>'+v+'</b></div>';
  st.innerHTML=stat("Расходы за месяц",fmtShort(M.exp))+stat("Приход за месяц",fmtShort(M.inc))+
    stat("Средний расход в день",fmtShort(M.exp/Math.max(1,elapsed)))+
    stat("Самый дорогой день",top1&&top1.spent>0?dl(top1.date)+" · "+fmtShort(top1.spent):"—")+
    stat("Самый денежный день",best&&best.inc>0?dl(best.date)+" · "+fmtShort(best.inc):"—")+
    stat("Дней без записей",String(empty));
  box.appendChild(st);
  // на что ушли деньги
  if(M.exp>0){
    const blk=document.createElement("div"); blk.className="block"; blk.style.marginTop="14px";
    let bar='<div class="stack">', lg='<div class="legend">';
    COLS.filter(c=>c.sign<0&&M.c[c.id]>0).forEach(c=>{
      const pct=M.c[c.id]/M.exp*100;
      bar+='<i style="width:'+pct+'%;background:'+c.color+'"></i>';
      lg+='<span><i style="background:'+c.color+'"></i>'+c.name+' '+Math.round(pct)+'% · '+fmtShort(M.c[c.id])+'</span>';
    });
    blk.innerHTML='<h2>На что ушли деньги</h2>'+bar+'</div>'+lg+'</div>';
    box.appendChild(blk);
  }
  return box;
}

const stepsOf = gid => S.steps.filter(x=>x.goal_id===gid)
  .sort((a,b)=>(a.pos-b.pos)||(a.due||"9999").localeCompare(b.due||"9999"));
const dstepsOf = did => S.steps.filter(x=>x.debt_id===did)
  .sort((a,b)=>(a.pos-b.pos)||(a.due||"9999").localeCompare(b.due||"9999"));
const parentIsDebt = id => S.debts.some(d=>d.id===id);
/* оплата долга считается по этапам: сумма выполненных; все выполнены - долг закрыт */
function debtSync(did){
  const d=S.debts.find(x=>x.id===did); if(!d) return;
  const st=dstepsOf(did); if(!st.length) return;
  const all=st.every(x=>x.done);
  const paid = all ? d.amount : Math.min(d.amount, st.filter(x=>x.done).reduce((t,x)=>t+(x.amount||0),0));
  if(paid!==d.paid){ d.paid=paid; d.updated_at=nowISO();
    enqueue({kind:"debt_update", id:d.id, row:{paid:d.paid,updated_at:d.updated_at}}); }
}
function stepRow(x){
  const row=document.createElement("div"); row.className="step";
  const bx=document.createElement("div"); bx.className="sbox"+(x.done?" done":""); bx.textContent=x.done?"✓":"";
  const mid=document.createElement("div"); mid.style.cssText="flex:1 1 auto;min-width:0";
  const dl=daysLeft(x.due); const late=!x.done && x.due && dl<0;
  const parts=[];
  if(x.due) parts.push((late?"просрочено · ":"до ")+x.due.split("-").reverse().join("."));
  if(x.amount) parts.push(fmt(x.amount,x.cur||"UZS"));
  mid.innerHTML='<div class="stitle'+(x.done?" done":"")+'">'+escapeHtml(x.title)+'</div>'+
    (parts.length?'<div class="sdue'+(late?" late":"")+'">'+parts.join(" · ")+'</div>':"");
  row.onclick=()=>toggleStep(x.id);
  const ed=document.createElement("button"); ed.className="glink"; ed.textContent="изм.";
  ed.onclick=ev=>{ ev.stopPropagation(); openStep(x.id); };
  row.appendChild(bx); row.appendChild(mid); row.appendChild(ed);
  return row;
}
/* цель закрывается сама, когда выполнены все этапы; снятая галочка этапа снова открывает цель */
function goalSyncDone(gid){
  const g=S.goals.find(x=>x.id===gid); if(!g) return;
  const st=stepsOf(gid); if(!st.length) return;
  const all=st.every(x=>x.done);
  if(g.done!==all){ g.done=all; g.updated_at=nowISO();
    enqueue({kind:"goal_update", id:g.id, row:{done:g.done, updated_at:g.updated_at}}); }
}
function toggleStep(id){
  const x=S.steps.find(v=>v.id===id); if(!x) return;
  x.done=!x.done; x.done_at=x.done?nowISO():null; x.updated_at=nowISO();
  enqueue({kind:"step_update", id:x.id, row:{done:x.done, done_at:x.done_at, updated_at:x.updated_at}});
  if(x.debt_id){
    const d0=S.debts.find(v=>v.id===x.debt_id), was=d0&&debtClosed(d0);
    debtSync(x.debt_id);
    if(d0 && debtClosed(d0) && !was) toast("Долг закрыт: «"+d0.person+"»");
  }else{
    const wasDone=(S.goals.find(g=>g.id===x.goal_id)||{}).done;
    goalSyncDone(x.goal_id);
    const g=S.goals.find(v=>v.id===x.goal_id);
    if(g && g.done && !wasDone) toast("Цель выполнена: «"+g.title+"»");
  }
  cacheSave(); render(); flushThen();
}
function toggleGoal(id){
  const g=S.goals.find(x=>x.id===id); if(!g) return;
  if(stepsOf(g.id).length){ toast("Цель закроется сама, когда выполнены все этапы"); return; }
  g.done=!g.done; g.updated_at=nowISO();
  cacheSave(); enqueue({kind:"goal_update", id:g.id, row:{done:g.done, updated_at:g.updated_at}});
  render(); flushThen();
}

/* ---------- этапы цели ---------- */
let stdraft=null;
/* кнопка «Убрать срок» под полем даты: на телефоне дату иначе не стереть */
function addClear(m,sel){

const p2=n=>String(n).padStart(2,"0");
function addMonthsISO(iso,k){
  const [y,m,d]=iso.split("-").map(Number);
  const dim=new Date(y,m-1+k+1,0).getDate(), t=new Date(y,m-1+k,1);
  return t.getFullYear()+"-"+p2(t.getMonth()+1)+"-"+p2(Math.min(d,dim));
}
function addDaysISO(iso,k){
  const [y,m,d]=iso.split("-").map(Number), t=new Date(y,m-1,d+k);
  return t.getFullYear()+"-"+p2(t.getMonth()+1)+"-"+p2(t.getDate());
}
/* серия этапов: например «выплатить машину за 5 месяцев» */
function openPlan(gid){
  const isD=parentIsDebt(gid), g=isD?S.debts.find(x=>x.id===gid):S.goals.find(x=>x.id===gid); if(!g) return;
  const pcur=isD?g.cur:"UZS";

  const m=$("#modal");
  m.innerHTML='<button class="mclose" id="mClose">×</button><h3>Разбить на этапы</h3>'+
    '<div class="hint" style="margin:-4px 0 12px">'+(isD?"Долг":"Цель")+': «'+escapeHtml(isD?g.person:g.title)+'». Этапы потом можно менять по одному (сумму, срок, название).</div>'+
    '<div class="two"><div class="field"><label for="pN">Сколько этапов</label><input id="pN" inputmode="numeric" value="5"></div>'+
    '<div class="field"><label for="pP">Раз в</label><select id="pP"><option value="m">месяц</option><option value="w">неделю</option></select></div></div>'+
    '<div class="field"><label for="pT">Название этапа</label><input id="pT" value="Месяц"></div>'+
    '<div class="two"><div class="field"><label for="pA">Сумма за этап (необязательно)</label><input id="pA" inputmode="decimal" placeholder="2 млн"></div>'+
    '<div class="field"><label for="pC">Валюта</label><select id="pC"><option value="UZS"'+(pcur!=="USD"?" selected":"")+'>сум</option><option value="USD"'+(pcur==="USD"?" selected":"")+'>доллар</option></select></div></div>'+
    '<div class="field"><label for="pD">Срок первого этапа</label><input id="pD" type="date" value="'+addMonthsISO(todayISO(),1)+'"></div>'+
    '<div class="conv-sum" id="pSum"></div>';
  const ok=document.createElement("button"); ok.className="btn"; ok.textContent="Создать этапы"; ok.onclick=commitPlan;
  m.appendChild(ok);
  const upd=()=>{
    const n=parseInt(m.querySelector("#pN").value,10)||0, a=(parseAmount(m.querySelector("#pA").value)||{}).amount||0;
    const cur=m.querySelector("#pC").value;
    m.querySelector("#pSum").textContent = n>0 ? (a?(n+" × "+fmt(a,cur)+" = "+fmt(n*a,cur)):(n+" этапов без суммы")) : "Укажи число этапов";
  };
  ["#pN","#pA","#pC"].forEach(q=>{ m.querySelector(q).addEventListener("input",upd); m.querySelector(q).addEventListener("change",upd); });
  m.querySelector("#pP").addEventListener("change",()=>{ const t=m.querySelector("#pT"); if(t.value==="Месяц"||t.value==="Неделя") t.value=m.querySelector("#pP").value==="w"?"Неделя":"Месяц"; });
  upd();
  m.querySelector("#mClose").onclick=dismissModal; $("#scrim").hidden=false;
}
function commitPlan(){
  const m=$("#modal"), gid=stdraft.goal;
  const n=parseInt(m.querySelector("#pN").value,10);
  if(!(n>=1&&n<=60)){ toast("Этапов от 1 до 60"); return; }
  const aRaw=m.querySelector("#pA").value.trim(), a=aRaw?(parseAmount(aRaw)||{}).amount:null;
  if(aRaw && !(a>0)){ toast("Не понял сумму"); return; }
  const cur=m.querySelector("#pC").value, per=m.querySelector("#pP").value;
  const title=m.querySelector("#pT").value.trim()||"Этап", start=m.querySelector("#pD").value||null;
  const isD=parentIsDebt(gid);
  const base=(isD?dstepsOf(gid):stepsOf(gid)).reduce((x,y)=>Math.max(x,y.pos),0);
  const now=nowISO();
  for(let i=0;i<n;i++){
    const due=start?(per==="w"?addDaysISO(start,7*i):addMonthsISO(start,i)):null;
    const row={id:uuid(),goal_id:isD?null:gid,debt_id:isD?gid:null,title:title+" "+(i+1),amount:a||null,cur:a?cur:null,due:due||"",done:false,done_at:null,
               pos:base+i+1,source:"user",created_at:now,updated_at:now};
    S.steps.push(row);
    enqueue({kind:"step_insert", id:row.id, row:{id:row.id,goal_id:row.goal_id,debt_id:row.debt_id,title:row.title,amount:row.amount,cur:row.cur,
             due:due||null,done:false,pos:row.pos,source:"user"}});
  }
  if(isD) debtSync(gid); else goalSyncDone(gid);
  cacheSave(); closeModal(); render(); flushThen();
}
function openStep(id,gid){
  if(!id && !resuming && DR.step && DR.step.obj.goal===gid && drResume("step")) return;
  const x=id?S.steps.find(v=>v.id===id):null;

function commitStep(){

  const cur=m.querySelector("#sC").value, due=m.querySelector("#sD").value||null, now=nowISO();
  if(stdraft.id){
    const x=S.steps.find(v=>v.id===stdraft.id);

    enqueue({kind:"step_update", id:x.id, row:{title,amount:x.amount,cur:x.cur,due,updated_at:now}});
    if(x.debt_id) debtSync(x.debt_id);
  }else{
    const isD=parentIsDebt(stdraft.goal);
    const pos=(isD?dstepsOf(stdraft.goal):stepsOf(stdraft.goal)).reduce((v,y)=>Math.max(v,y.pos),0)+1;
    const row={id:uuid(),goal_id:isD?null:stdraft.goal,debt_id:isD?stdraft.goal:null,title,amount:a||null,cur:a?cur:null,due:due||"",done:false,done_at:null,pos,
               source:"user",created_at:now,updated_at:now};

    if(isD) debtSync(stdraft.goal); else goalSyncDone(stdraft.goal);

}

/* ---------- долги ---------- */
/* kind: owe = я должен, owed = мне должны. Долги ведутся отдельно: на остатки кошельков, приход и расход не влияют. */
let dbdraft=null;
const debtLeft = d => Math.max(d.amount-d.paid,0);
const debtClosed = d => d.paid>=d.amount;
function debtTotals(kind){
  const t={UZS:0,USD:0};
  S.debts.filter(d=>d.kind===kind && !debtClosed(d)).forEach(d=>{ t[d.cur]=(t[d.cur]||0)+debtLeft(d); });
  return t;
}
function debtTotalText(t){
  const parts=[]; if(t.UZS>0) parts.push(fmt(t.UZS,"UZS")); if(t.USD>0) parts.push(fmt(t.USD,"USD"));
  return parts.length?parts.join(" + "):"—";
}
function viewDebts(){
  const box=document.createElement("div");
  const owe=S.debts.filter(d=>d.kind==="owe"&&!debtClosed(d)), owed=S.debts.filter(d=>d.kind==="owed"&&!debtClosed(d));

  const to=debtTotals("owe"), td=debtTotals("owed");

    '<div class="debt-sum"><span>Мне должны</span><b style="color:var(--green)">'+debtTotalText(td)+'</b></div>'+
    (S.debts.length?'<div class="debt-sum" style="border-top:1px solid var(--grid)"><span>'+(net>=0?"В плюсе на":"В минусе на")+
      '</span><b>'+fmt(Math.abs(net))+'</b></div>':"")+
    '<div class="hint" style="margin-top:8px">Долги ведутся отдельно и на остатки кошельков не влияют. Если деньги реально взяты или отданы, внеси это в тетрадь отдельной записью.</div>';
  const add=document.createElement("button"); add.className="btn ghost"; add.style.marginTop="10px"; add.textContent="Новый долг";
  add.onclick=()=>openDebt(null); b0.appendChild(add);
  box.appendChild(b0);

  [["Я должен",owe],["Мне должны",owed]].forEach(([title,list])=>{

function debtRow(d){
  const wrap=document.createElement("div"); wrap.className="goalwrap";
  const row=document.createElement("div"); row.className="goal";
  const dl=daysLeft(d.due), closed=debtClosed(d), sts=dstepsOf(d.id);
  let due="", cls="";
  if(closed) due="закрыт";
  else if(!d.due) due="без срока";
  else if(dl<0){ due="просрочено на "+Math.abs(dl)+" дн · "+d.due.split("-").reverse().join("."); cls=" late"; }
  else if(dl===0){ due="срок сегодня"; cls=" late"; }
  else if(dl<=7){ due="осталось "+dl+" дн"; cls=" soon"; }
  else due="до "+d.due.split("-").reverse().join(".");
  const pct=Math.min(100,Math.round(d.paid/d.amount*100));
  const mid=document.createElement("div"); mid.className="gmid";
  mid.innerHTML='<div class="gtitle'+(closed?" done":"")+'">'+escapeHtml(d.person)+(d.note?' <span style="color:var(--ink-faint);font-size:12.5px">· '+escapeHtml(d.note)+'</span>':"")+'</div>'+
    '<div class="gdue">'+(closed?fmt(d.amount,d.cur):("осталось "+fmt(debtLeft(d),d.cur)+" из "+fmt(d.amount,d.cur)))+'</div>'+
    '<div class="gdue'+cls+'">'+due+(d.source==="ai"?" · ✦":"")+'</div>'+
    (sts.length?'<div class="gdue">этапов выполнено '+sts.filter(x=>x.done).length+' из '+sts.length+'</div>':"")+
    (d.paid>0&&!closed?'<div class="gprog"><i style="width:'+pct+'%"></i></div>':"");
  mid.onclick=()=>openDebt(d.id);
  row.appendChild(mid);
  wrap.appendChild(row);
  if(!closed || sts.length){
    const box=document.createElement("div"); box.className="gsteps"; box.style.marginLeft="0";
    sts.forEach(x=>box.appendChild(stepRow(x)));
    if(!closed){
      const lk=document.createElement("button"); lk.className="glink";
      lk.textContent=sts.length?"+ этап":"Разбить на этапы";
      lk.onclick=()=>sts.length?openStep(null,d.id):openPlan(d.id);
      box.appendChild(lk);
      if(sts.length){
        const lk2=document.createElement("button"); lk2.className="glink"; lk2.style.marginLeft="14px";
        lk2.textContent="Добавить серию"; lk2.onclick=()=>openPlan(d.id); box.appendChild(lk2);
      }
    }
    if(box.children.length) wrap.appendChild(box);
  }
  return wrap;
}

    m.appendChild(del);

function commitDebt(){
  const m=$("#modal"), person=m.querySelector("#dP").value.trim();
  if(!person){ toast("Впиши, кто"); return; }
  const a=(parseAmount(m.querySelector("#dA").value)||{}).amount;
  if(!(a>0)){ toast("Впиши сумму долга"); return; }
  const cur=m.querySelector("#dC").value, due=m.querySelector("#dD").value||null, note=m.querySelector("#dN").value.trim();
  const payEl=m.querySelector("#dPay"), now=nowISO();
  if(dbdraft.id){
    const d=S.debts.find(x=>x.id===dbdraft.id);
    let paid=d.paid;
    if(payEl && payEl.value.trim()){
      const p=(parseAmount(payEl.value)||{}).amount;
      if(!(p>0)){ toast("Не понял сумму оплаты"); return; }
      paid=paid+p;
    }
    paid=Math.min(paid,a);
    Object.assign(d,{kind:dbdraft.kind,person,amount:a,cur,paid,due:due||"",note,updated_at:now});
    enqueue({kind:"debt_update", id:d.id, row:{kind:d.kind,person,amount:a,cur,paid,due,note,updated_at:now}});
    debtSync(d.id);
  }else{
    const row={id:uuid(),kind:dbdraft.kind,person,amount:a,cur,paid:0,due:due||"",note,source:"user",created_at:now,updated_at:now};
    S.debts.push(row);
    enqueue({kind:"debt_insert", id:row.id, row:{id:row.id,kind:row.kind,person,amount:a,cur,paid:0,due,note,source:"user"}});
  }
  cacheSave(); closeModal(); render(); flushThen();
}

/* ---------- графики месяца ---------- */
function daysInMonth(ym){ const [y,m]=ym.split("-").map(Number); return new Date(y,m,0).getDate(); }
function lastShownDay(ym){
  const n=daysInMonth(ym), cur=ymNow();
  if(ym<cur) return n;
  if(ym===cur) return new Date().getDate();
  return 0;
}
function dShort(ym,d){ return String(d).padStart(2,"0")+" "+MONTHS[Number(ym.slice(5,7))-1].slice(0,3).toLowerCase(); }
function svgEl(w,h,inner){ return '<svg viewBox="0 0 '+w+' '+h+'" role="img" preserveAspectRatio="xMidYMid meet">'+inner+'</svg>'; }

function chartBalanceBlock(ym){
  const b=document.createElement("div"); b.className="block";
  const N=lastShownDay(ym);
  if(!N){ b.innerHTML="<h2>Остаток по дням</h2><div class=\"chart-note\">Этот месяц ещё не начался.</div>"; return b; }
  const days=dayMap(), keys=Object.keys(days).sort();
  const first=ym+"-01";
  let open=WALLETS.reduce((a,w)=>a+toBase(Number(S.settings.starts[w.id]||0),w.cur),0);
  keys.forEach(k=>{ if(k<first && days[k].bal) open=totalOfBal(days[k].bal); });
  const vals=[]; let cur=open;
  for(let d=1; d<=N; d++){
    const k=ym+"-"+String(d).padStart(2,"0");
    if(days[k] && days[k].bal) cur=totalOfBal(days[k].bal);
    vals.push(cur);
  }
  const delta=vals[vals.length-1]-open;
  const hasData=keys.some(k=>k.slice(0,7)===ym);
  const W=320,H=150,L=40,R=10,T=12,B=26, pw=W-L-R, ph=H-T-B;
  let mn=Math.min(open,...vals), mx=Math.max(open,...vals);
  if(mx===mn){ mx+=1; mn-=1; }
  const pad=(mx-mn)*0.08; mn-=pad; mx+=pad;
  const X=i=> N===1 ? L+pw/2 : L+pw*i/(N-1), Y=v=> T+ph*(1-(v-mn)/(mx-mn));
  let pts=vals.map((v,i)=>X(i).toFixed(1)+","+Y(v).toFixed(1));
  let g='';
  [mn+pad,(mn+mx)/2,mx-pad].forEach((v,idx)=>{
    g+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(v).toFixed(1)+'" y2="'+Y(v).toFixed(1)+'" stroke="var(--grid)" stroke-width="1"/>'+
       '<text x="'+(L-5)+'" y="'+(Y(v)+3).toFixed(1)+'" text-anchor="end" font-size="9.5" fill="var(--ink-faint)">'+fmtShort(v)+'</text>';
  });
  if(mn<0&&mx>0) g+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(0).toFixed(1)+'" y2="'+Y(0).toFixed(1)+'" stroke="var(--ink-faint)" stroke-dasharray="3 3"/>';
  const area='M'+X(0).toFixed(1)+","+(T+ph)+" L"+pts.join(" L")+" L"+X(N-1).toFixed(1)+","+(T+ph)+" Z";
  g+='<path d="'+area+'" fill="var(--blue)" opacity=".07"/>'+
     '<polyline points="'+pts.join(" ")+'" fill="none" stroke="var(--blue)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>';
  const lx=X(N-1), ly=Y(vals[N-1]);
  g+='<circle id="bcDot" cx="'+lx.toFixed(1)+'" cy="'+ly.toFixed(1)+'" r="4" fill="var(--blue)" stroke="var(--card)" stroke-width="2"/>';
  g+='<line id="bcLine" x1="'+lx.toFixed(1)+'" x2="'+lx.toFixed(1)+'" y1="'+T+'" y2="'+(T+ph)+'" stroke="var(--ink-faint)" stroke-width="1" opacity="0"/>';
  const ticks=[1]; if(N>=8) ticks.push(Math.round(N/2)); if(N>1) ticks.push(N);
  [...new Set(ticks)].forEach(d=>{
    g+='<text x="'+X(d-1).toFixed(1)+'" y="'+(H-8)+'" text-anchor="middle" font-size="9.5" fill="var(--ink-faint)">'+d+'</text>';
  });
  const hw=N===1?pw:pw/(N-1);
  for(let i=0;i<N;i++){
    g+='<rect class="bar-hit" data-i="'+i+'" x="'+(X(i)-hw/2).toFixed(1)+'" y="'+T+'" width="'+hw.toFixed(1)+'" height="'+ph+'" fill="transparent"/>';
  }
  b.innerHTML='<div class="chart-head"><h2>Остаток по дням</h2>'+
    (hasData?'<div class="chart-delta '+(delta>=0?"up":"down")+'">'+(delta>=0?"+":"−")+fmt(Math.abs(delta))+'</div>':"")+'</div>'+
    '<div class="chart-box">'+svgEl(W,H,g)+'</div>'+
    '<div class="tip" id="bcTip" aria-live="polite">'+
      (hasData?(delta>=0?"За месяц прибавилось, ":"За месяц ушло, ")+"остаток на старте месяца "+fmt(open)
              :"В этом месяце записей ещё нет")+'</div>'+
    '<div class="chart-note">Общий остаток по всем кошелькам в '+(S.settings.base==="USD"?"долларах":"сумах")+' по текущему курсу. Нажми на день, чтобы увидеть цифры.</div>';
  b.querySelectorAll(".bar-hit").forEach(r=>{
    const show=()=>{
      const i=Number(r.dataset.i), v=vals[i], prev=i?vals[i-1]:open, dd=v-prev;
      b.querySelector("#bcDot").setAttribute("cx",X(i).toFixed(1)); b.querySelector("#bcDot").setAttribute("cy",Y(v).toFixed(1));
      const ln=b.querySelector("#bcLine"); ln.setAttribute("x1",X(i).toFixed(1)); ln.setAttribute("x2",X(i).toFixed(1)); ln.setAttribute("opacity","1");
      b.querySelector("#bcTip").textContent=dShort(ym,i+1)+": остаток "+fmt(v)+" ("+(dd>=0?"+":"−")+fmt(Math.abs(dd))+" за день)";
    };
    r.addEventListener("mouseenter",show); r.addEventListener("click",show);
  });
  return b;
}

function chartSpendBlock(ym){
  const b=document.createElement("div"); b.className="block";
  const n=daysInMonth(ym), N=lastShownDay(ym)||n;
  const cats=COLS.filter(c=>c.sign<0);
  const per=Array.from({length:n},()=>({real:0,byt:0,lich:0,auto:0,sum:0}));
  rawMonth(ym).forEach(e=>{ if(isConv(e)||e.col==="self"||!(e.col in per[0])||colById(e.col).sign>0) return;
    const d=Number(e.date.slice(8,10))-1, v=eBase(e);
    per[d][e.col]+=v; per[d].sum+=v; });
  const total=per.reduce((a,x)=>a+x.sum,0);
  if(!total){ b.innerHTML="<h2>Расходы по дням</h2><div class=\"chart-note\">Расходов за этот месяц ещё нет.</div>"; return b; }
  const W=320,H=150,L=40,R=10,T=12,B=26, pw=W-L-R, ph=H-T-B;
  const mx=Math.max(...per.map(x=>x.sum));
  const slot=pw/n, bw=Math.max(3,Math.min(14,slot*0.62));
  const Y=v=>T+ph*(1-v/mx);
  let g='';
  [0,mx/2,mx].forEach(v=>{
    g+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(v).toFixed(1)+'" y2="'+Y(v).toFixed(1)+'" stroke="'+(v===0?"var(--ink-faint)":"var(--grid)")+'" stroke-width="1"/>'+
       '<text x="'+(L-5)+'" y="'+(Y(v)+3).toFixed(1)+'" text-anchor="end" font-size="9.5" fill="var(--ink-faint)">'+fmtShort(v)+'</text>';
  });
  per.forEach((x,i)=>{
    const cx=L+slot*(i+0.5); let acc=0;
    cats.forEach(c=>{
      const v=x[c.id]; if(!v) return;
      const y1=Y(acc+v), y0=Y(acc); acc+=v;
      g+='<rect x="'+(cx-bw/2).toFixed(1)+'" y="'+y1.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+Math.max(0.5,(y0-y1)).toFixed(1)+
         '" rx="1.5" fill="'+CHART_COL[c.id]+'" stroke="var(--card)" stroke-width="1.2"/>';
    });
    g+='<rect class="bar-hit" data-i="'+i+'" x="'+(cx-slot/2).toFixed(1)+'" y="'+T+'" width="'+slot.toFixed(1)+'" height="'+ph+'" fill="transparent"/>';
  });
  const ticks=[...new Set([1,Math.round(n/2),n])];
  ticks.forEach(d=>{
    g+='<text x="'+(L+slot*(d-0.5)).toFixed(1)+'" y="'+(H-8)+'" text-anchor="middle" font-size="9.5" fill="var(--ink-faint)">'+d+'</text>';
  });
  const topI=per.reduce((bi,x,i)=>x.sum>per[bi].sum?i:bi,0);
  b.innerHTML='<div class="chart-head"><h2>Расходы по дням</h2><div class="chart-delta" style="color:var(--ink)">'+fmt(total)+'</div></div>'+
    '<div class="chart-box">'+svgEl(W,H,g)+'</div>'+
    '<div class="legend">'+cats.map(c=>'<span><i style="background:'+CHART_COL[c.id]+'"></i>'+c.name+'</span>').join("")+'</div>'+
    '<div class="tip" id="spTip" aria-live="polite">Больше всего ушло '+dShort(ym,topI+1)+': '+fmt(per[topI].sum)+'</div>'+
    '<div class="chart-note">Обмены сюда не входят. Нажми на столбик, чтобы увидеть, на что ушёл день.</div>';
  b.querySelectorAll(".bar-hit").forEach(r=>{
    const show=()=>{
      const i=Number(r.dataset.i), x=per[i];
      const parts=cats.filter(c=>x[c.id]>0).map(c=>c.short+" "+fmt(x[c.id]));
      b.querySelector("#spTip").textContent=dShort(ym,i+1)+": "+(x.sum?("всего "+fmt(x.sum)+" · "+parts.join(" · ")):"расходов не было");
    };
    r.addEventListener("mouseenter",show); r.addEventListener("click",show);
  });
  return b;
}

/* ---------- плачу себе ---------- */
function payPct(){ const v=Number(S.settings.payPct); return v>=1&&v<=100?v:10; }
function payBase(){ return S.settings.payBase==="real"?"real":"all"; }
function fromBase(v,cur){
  const s=S.settings;
  if(cur===s.base) return v;
  if(s.base==="USD"&&cur==="UZS") return v*(s.rate||1);
  if(s.base==="UZS"&&cur==="USD") return v/(s.rate||1);
  return v;
}
function profitMonth(ym){
  const t=monthTotals(ym);
  const spent = payBase()==="real" ? t.real : COLS.filter(c=>c.sign<0).reduce((a,c)=>a+t[c.id],0);
  return t.in-spent;
}
function selfSum(list){ return list.filter(e=>e.col==="self").reduce((a,e)=>a+eBase(e),0); }
function paidSelf(ym){ return selfSum(rawMonth(ym)); }
function dueSelf(ym){ return Math.max(0,profitMonth(ym))*payPct()/100; }

function paySelfBlock(ym){
  const b=document.createElement("div"); b.className="block";
  const profit=profitMonth(ym), due=dueSelf(ym), paid=paidSelf(ym), left=Math.max(0,due-paid);
  const pct=due>0?Math.min(100,Math.round(paid/due*100)):0;
  let opts=""; for(let i=5;i<=15;i++) opts+='<option value="'+i+'"'+(payPct()===i?" selected":"")+'>'+i+'%</option>';
  b.innerHTML='<div class="chart-head"><h2 style="display:flex;align-items:center;gap:8px">'+ico("self","var(--teal)",20)+'Плачу себе</h2>'+
    '<div class="chart-delta" style="color:var(--ink)">'+fmt(due)+'</div></div>'+
    '<div class="two"><div class="field" style="margin-bottom:8px"><label for="psPct">Доля от прибыли</label>'+
      '<select id="psPct">'+opts+'</select></div>'+
    '<div class="field" style="margin-bottom:8px"><label for="psBase">Прибыль = приход</label>'+
      '<select id="psBase"><option value="all"'+(payBase()==="all"?" selected":"")+'>минус все расходы</option>'+
      '<option value="real"'+(payBase()==="real"?" selected":"")+'>минус реализацию</option></select></div></div>'+
    kv("Прибыль месяца",(profit<0?"−":"")+fmt(Math.abs(profit)))+
    kv("Положено себе ("+payPct()+"%)",fmt(due))+
    kv("Уже выплачено",fmt(paid))+
    '<div class="bar selfbar" style="margin:8px 0 4px"><i style="width:'+pct+'%"></i></div>'+
    kv(paid>due&&due>0?"Выплачено сверх доли":"Осталось выплатить",fmt(paid>due?paid-due:left));
  if(profit<=0) b.insertAdjacentHTML("beforeend",'<div class="selfnote">Прибыли в этом месяце нет, платить себе пока не из чего.</div>');
  const btn=document.createElement("button");
  btn.className="btn"; btn.style.marginTop="12px"; btn.textContent="Выплатить себе";
  btn.onclick=()=>openSelf(); b.appendChild(btn);
  const all=selfSum(S.entries);
  b.insertAdjacentHTML("beforeend",'<div class="selfnote">За всё время выплачено себе: <b>'+fmt(all)+
    '</b>. Это отдельная запись «Себе»: она списывает деньги с кошелька, но не считается обычным расходом и не уменьшает прибыль.</div>');
  b.querySelector("#psPct").onchange=ev=>{ S.settings.payPct=Number(ev.target.value);
    cacheSave(); enqueue({kind:"settings"}); flushThen(); render(); };
  b.querySelector("#psBase").onchange=ev=>{ S.settings.payBase=ev.target.value;
    cacheSave(); enqueue({kind:"settings"}); flushThen(); render(); };
  return b;
}

let sdraft=null;
function selfPrefill(){
  const w=walletById(sdraft.wallet);
  const left=Math.max(0,dueSelf(sdraft.month)-paidSelf(sdraft.month));
  return left>0 ? String(roundCur(fromBase(left,w.cur),w.cur)) : "";
}
function openSelf(){
  if(!resuming && drResume("self")) return;
  sdraft={ wallet:"cash_uzs", note:"себе", date:todayISO(), month:ui.month, amount:"", auto:true };
  drawSelf();
}
function readSelf(){
  const m=$("#modal"); if(!m.querySelector("#sAmt")) return;
  sdraft.amount=m.querySelector("#sAmt").value;
  sdraft.note=m.querySelector("#sNote").value;
  sdraft.date=m.querySelector("#sDate").value||todayISO();
}
function drawSelf(){
  const m=$("#modal"); if(sdraft.auto) sdraft.amount=selfPrefill();
  const due=dueSelf(sdraft.month), paid=paidSelf(sdraft.month);
  m.innerHTML='<button class="mclose" id="mClose" aria-label="Закрыть">×</button>'+
    "<h3>Выплата себе</h3>"+
    '<div class="hint" style="margin-top:-6px">Положено за месяц: '+fmt(due)+' · выплачено: '+fmt(paid)+'</div>'+
    '<div class="field"><label>Откуда взять деньги</label><div class="picker two-col" id="sWal"></div></div>'+
    '<div class="field"><label for="sAmt">Сумма</label>'+
      '<input id="sAmt" inputmode="decimal" value="'+escapeHtml(sdraft.amount)+'">'+
      '<div class="quick" id="sQuick"></div></div>'+

    '<div class="field"><label for="sDate">Дата</label><input id="sDate" type="date" value="'+sdraft.date+'"></div>';
  const wp=m.querySelector("#sWal");
  WALLETS.forEach(w=>{
    const b=document.createElement("button");
    b.className="pick"+(sdraft.wallet===w.id?" on":"");
    b.innerHTML=ico(walletIcon(w),"var(--ink-soft)",20)+w.name;
    b.onclick=()=>{ readSelf(); sdraft.wallet=w.id; drawSelf(); };
    wp.appendChild(b);
  });
  const q=m.querySelector("#sQuick");
  [["+ тыс",1e3],["+ млн",1e6]].forEach(([lbl,mult])=>{
    const b=document.createElement("button"); b.textContent=lbl;
    b.onclick=()=>{ const el=m.querySelector("#sAmt"); const n=cNum(el.value);
      if(isFinite(n)) el.value=String(Math.round(n*mult)); sdraft.auto=false; el.focus(); };
    q.appendChild(b);
  });
  const cl=document.createElement("button"); cl.textContent="← стереть";
  cl.onclick=()=>{ const el=m.querySelector("#sAmt"); el.value=""; sdraft.auto=false; el.focus(); };
  q.appendChild(cl);
  m.querySelector("#sAmt").addEventListener("input",()=>{ sdraft.auto=false; });
  const ok=document.createElement("button");
  ok.className="btn"; ok.textContent="Записать выплату"; ok.onclick=commitSelf; m.appendChild(ok);
  m.querySelector("#mClose").onclick=dismissModal;
  $("#scrim").hidden=false;
}
function commitSelf(){
  readSelf();
  const p=parseAmount(sdraft.amount);
  if(!p||!p.amount){ toast("Впиши сумму"); return; }
  const w=walletById(sdraft.wallet), now=nowISO();
  const row={id:uuid(),date:sdraft.date,col:"self",amount:p.amount,cur:w.cur,wallet:w.id,
             note:sdraft.note.trim(),source:"user",created_at:now,updated_at:now};
  S.entries.push(row);
  enqueue({kind:"insert", id:row.id,
    row:{id:row.id,date:row.date,col:row.col,amount:row.amount,cur:row.cur,wallet:row.wallet,
         note:row.note,source:"user",created_at:now}});
  ui.month=row.date.slice(0,7);
  cacheSave(); closeModal(); render(); flushThen(); toast("Выплата записана");
}

      api("/rest/v1/ai_chat?select=id,role,content,action_id,created_at&order=created_at.desc&limit=200"),

      api("/rest/v1/ai_usage?select=cost_usd,calls&created_at=gte."+encodeURIComponent(aiDayStart())).catch(()=>[])

function aiDrawList(){
  const box=document.getElementById("aiList"); if(!box) return;
  const sig=JSON.stringify([AI.msgs.map(m=>m.id),Object.values(AI.actions).map(a=>a.id+a.status),Object.keys(AI.busy),AI.thinking]);
  if(box.dataset.sig===sig) return;
  box.dataset.sig=sig;
  const grew=AI.msgs.length!==AI.n; AI.n=AI.msgs.length;
  box.innerHTML="";
  if(!AI.msgs.length && !AI.thinking){
    box.innerHTML='<div class="empty"><b>Пока пусто</b>Напиши сообщение. Например: «сколько у меня на картах?» или «покажи расходы за месяц».</div>';
    return;
  }
  let lastDay="";
  AI.msgs.forEach(m=>{
    const day=dmy(m.created_at);

    const d=document.createElement("div"); d.className="cb "+(m.role==="user"?"me":"bot");

    }

        const busy=!!AI.busy[a.id];
        slot.className="abtns";
        slot.innerHTML='<button class="ok">Одобрить</button><button class="no">Отклонить</button>';
        const ok=slot.querySelector(".ok"), no=slot.querySelector(".no");
        ok.disabled=no.disabled=busy;

/* ---------- курс записи: подставляется сам, правится вручную ---------- */
const RC=(()=>{ try{ return JSON.parse(LS.get("ezh:rc")||"{}")||{}; }catch(e){ return {}; } })();
const fmtRateIn=v=>String(Math.round(v*100)/100);
const dm2=iso=>iso.slice(8,10)+"."+iso.slice(5,7)+"."+iso.slice(0,4);
function rateHint(t){ const h=$("#fRateHint"); if(h) h.textContent=t; }
/* курс ЦБ на дату через функцию Supabase; null, если не получилось */
async function cbuOnDate(iso){
  if(RC[iso]>0) return RC[iso];
  try{
    const r=await fetch(SUPABASE_URL+"/functions/v1/cbu-rate?date="+iso);
    if(r.ok){ const d=await r.json();
      if(d&&d.ok&&Number(d.rate)>0){ RC[iso]=Number(d.rate); LS.set("ezh:rc",JSON.stringify(RC)); return RC[iso]; } }
  }catch(e){}
  return null;
}
async function rateAuto(dateChanged){
  if(!draft) return;
  const d=draft.date, fr=$("#fRate"); if(!fr) return;
  if(draft.rateTouched){ rateHint("Курс записан вручную."); return; }
  if(draft.id && draft.rate && !dateChanged){ rateHint("Курс этой записи, можно поправить."); return; }
  const put=(v,t)=>{ fr.value=fmtRateIn(v); draft.rate=fr.value; rateHint(t); };
  if(d===todayISO()){ put(S.settings.rate,"Курс на сегодня из шапки. Он сохранится в этой записи."); return; }
  if(RC[d]>0){ put(RC[d],"Курс ЦБ на "+dm2(d)+". Сохранится в этой записи."); return; }
  put(S.settings.rate,"Ищу курс ЦБ на "+dm2(d)+"…");
  const r=await cbuOnDate(d);
  if(!draft||draft.date!==d||draft.rateTouched||!$("#fRate")) return;
  if(r) put(r,"Курс ЦБ на "+dm2(d)+". Сохранится в этой записи.");
  else rateHint("Курс ЦБ на эту дату не нашёл, стоит курс из шапки. Поправь, если знаешь точнее.");
}
/* старым записям без курса проставляем курс ЦБ на дату записи */
let fillBusy=false;
async function fillRates(){
  if(fillBusy||!session||!navigator.onLine) return {done:0,failed:0};
  const miss=S.entries.filter(e=>e.book_rate==null&&!isPending(e.id));
  if(!miss.length) return {done:0,failed:0};
  fillBusy=true; let done=0, failed=0;
  const dates=[...new Set(miss.map(e=>e.date))];
  try{
    for(let i=0;i<dates.length;i+=4){
      await Promise.all(dates.slice(i,i+4).map(async d=>{
        const r=d===todayISO()?S.settings.rate:await cbuOnDate(d);
        if(!(r>0)){ failed++; return; }
        try{
          await api("/rest/v1/entries?date=eq."+d+"&book_rate=is.null",{method:"PATCH",body:{book_rate:r},
            headers:{"Content-Type":"application/json",Prefer:"return=minimal"}});
          S.entries.forEach(e=>{ if(e.date===d&&e.book_rate==null&&!isPending(e.id)){ e.book_rate=r; done++; } });
        }catch(e){ failed++; }
      }));
    }
  }finally{ fillBusy=false; }
  if(done){ cacheSave(); render(); }
  return {done,failed};
}
function commit(isZero){
  readDraft();
  let amount=0, note=draft.note.trim(), col=draft.col;
  if(isZero){ amount=0; col="in"; if(!note) note="прихода не было"; }
  else{
    const p=parseAmount(draft.amount);
    if(!p||!p.amount){ toast("Впиши сумму"); return; }
    amount=p.amount;
  }
  const w=walletById(draft.wallet);
  const now=nowISO();
  const rv=cNum(draft.rate), prev=draft.id?(S.entries.find(x=>x.id===draft.id)||{}).book_rate:null;
  const bookRate = rv>0 ? rv : (prev>0 ? prev : S.settings.rate);
  if(draft.id){
    const e=S.entries.find(x=>x.id===draft.id);
    Object.assign(e,{date:draft.date,col,amount,cur:w.cur,wallet:w.id,note,book_rate:bookRate,updated_at:now});
    enqueue({kind:"update", id:e.id,
      row:{date:e.date,col:e.col,amount:e.amount,cur:e.cur,wallet:e.wallet,note:e.note,book_rate:bookRate,updated_at:now}});
  }else{
    const row={id:uuid(),date:draft.date,col,amount,cur:w.cur,wallet:w.id,note,book_rate:bookRate,
               source:"user",created_at:now,updated_at:now};
    S.entries.push(row);
    enqueue({kind:"insert", id:row.id,
      row:{id:row.id,date:row.date,col:row.col,amount:row.amount,cur:row.cur,
           wallet:row.wallet,note:row.note,book_rate:bookRate,source:"user"}});
    ui.month=row.date.slice(0,7);
  }
  cacheSave(); closeModal(); render(); flushThen();
}
