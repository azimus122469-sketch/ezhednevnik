<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FBF9F3">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Ежедневник">
<meta name="mobile-web-app-capable" content="yes">
<title>Ежедневник</title>
<style>
  :root{
    --paper:#FBF9F3; --paper-2:#F3F0E7; --grid:#DCE5EE; --rule:#C0453C;
    --ink:#16202B; --ink-soft:#5C6875; --ink-faint:#98A1AC;
    --blue:#1F3A93; --teal:#0F766E; --green:#1E7A54; --amber:#A96A15; --red:#B23A32; --violet:#6B3FA0;
    --edge:#E2DDD1;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    --serif:Georgia,"Times New Roman",serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.4;
       padding-bottom:calc(96px + env(safe-area-inset-bottom))}
  body.auth{padding-bottom:24px}
  .sheet-paper{background-image:
      linear-gradient(var(--grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size:22px 22px;background-position:-1px -1px}
  .wrap{max-width:620px;margin:0 auto;padding:0 14px}
  body.wide .wrap{max-width:100%;padding:0 20px}
  body.wide .tabbar{max-width:100%}

  header{position:sticky;top:0;z-index:30;background:var(--paper);border-bottom:1px solid var(--edge)}
  header[hidden]{display:none}

  .purse{display:flex;gap:12px;align-items:flex-start;padding:12px 0 8px}
  .purse-left{flex:0 0 118px;min-width:0;padding-right:12px;border-right:1px solid var(--edge)}
  .purse-right{flex:1 1 auto;min-width:0}
  .purse-label{font-size:12px;color:var(--ink-faint);margin-bottom:3px}
  .rate-num{font-size:15px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.15}
  .rate-sub{font-size:11px;color:var(--ink-faint);margin-bottom:10px;line-height:1.3}
  .total-num{font-family:var(--serif);font-size:21px;line-height:1.05;font-weight:700;cursor:pointer;word-break:break-word}
  .total-num.neg{color:var(--red)}
  .total-sub{font-size:11px;color:var(--ink-faint);margin-top:3px;line-height:1.3}
  .prow{display:flex;justify-content:space-between;align-items:center;gap:8px;
        padding:4px 6px;border-bottom:1px solid var(--grid);cursor:pointer;border-radius:6px}
  .prow:last-child{border-bottom:none}
  .prow.on{background:var(--paper-2)}
  .prow span{font-size:12.5px;color:var(--ink-soft);white-space:nowrap;display:flex;align-items:center;gap:6px}
  .prow b{font-size:14px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
  .prow b.neg{color:var(--red)}
  .ico{flex:0 0 auto;display:inline-block;vertical-align:middle}

  .dayhead{padding:9px 12px 8px;background:var(--paper-2);border-bottom:1px solid var(--grid);border-top:1px solid var(--edge)}
  .dayhead:first-of-type{border-top:none}
  .dh-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
  .dh-date{font-size:13px;font-weight:700}
  .dh-flow{font-size:12px;color:var(--ink-soft);font-variant-numeric:tabular-nums;text-align:right}
  .dh-flow b{font-weight:700}
  .dh-wal{display:grid;grid-template-columns:1fr 1fr;gap:3px 10px;margin-top:6px;font-size:11.5px;color:var(--ink-soft);
          font-variant-numeric:tabular-nums}
  .dh-wal span{display:flex;align-items:center;gap:4px;white-space:nowrap;min-width:0}
  .dh-wal b{margin-left:auto}
  .dh-wal b{color:var(--ink);font-weight:600}
  .dh-wal b.neg{color:var(--red)}
  .conv-row .r-sum{font-size:13.5px;white-space:nowrap;gap:5px}
  .conv-arrow{color:var(--ink-faint);font-weight:400}

  .conv-pickrow{display:flex;gap:8px;align-items:center}
  .conv-pickrow .picker{flex:1}
  .conv-sum{margin:2px 0 14px;padding:10px 12px;border:1px dashed var(--edge);border-radius:9px;
            font-size:14px;background:#fff;font-variant-numeric:tabular-nums}

  .chart-box{position:relative}
  .chart-box svg{display:block;width:100%;height:auto;overflow:visible}
  .chart-note{font-size:12px;color:var(--ink-soft);margin-top:8px}
  .legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:12px;color:var(--ink-soft)}
  .legend span{display:flex;align-items:center;gap:5px}
  .legend i{width:10px;height:10px;border-radius:2px;display:inline-block}
  .chart-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:10px}
  .chart-head h2{margin:0}
  .chart-delta{font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}
  .chart-delta.up{color:var(--green)}.chart-delta.down{color:var(--red)}
  .tip{min-height:18px;font-size:12.5px;color:var(--ink);margin-top:8px;font-variant-numeric:tabular-nums}
  .bar-hit{cursor:pointer}
  .selfbar i{background:var(--teal)}
  .selfnote{font-size:12px;color:var(--ink-soft);margin-top:10px}

  .sync{font-size:12px;color:var(--ink-faint);padding-bottom:8px;display:flex;align-items:center;gap:6px}
  .sync.warn{color:var(--amber)}
  .sync.err{color:var(--red)}
  .sync .wbtn{margin-left:auto;border:1px solid var(--edge);background:#fff;border-radius:7px;
              padding:3px 8px;font-size:11.5px;font-family:inherit;color:var(--ink-soft);cursor:pointer}
  .month{display:flex;align-items:center;gap:6px;padding-bottom:10px}
  .month b{font-family:var(--serif);font-size:17px;font-weight:700;min-width:150px}
  .mbtn{border:1px solid var(--edge);background:#fff;color:var(--ink);width:30px;height:30px;
        border-radius:8px;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center}
  .mbtn:active{background:var(--paper-2)}
  .chips{display:flex;gap:6px;overflow-x:auto;padding:0 0 10px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;border:1px solid var(--edge);background:#fff;border-radius:9px;padding:6px 10px;
        cursor:pointer;font-size:13px;display:flex;align-items:baseline;gap:6px;color:var(--ink-soft);font-family:inherit}
  .chip b{font-size:13.5px;font-variant-numeric:tabular-nums}
  .chip.on{background:var(--paper-2)}
  .dot{width:7px;height:7px;border-radius:50%;display:inline-block;flex:0 0 auto;align-self:center}

  main{padding-top:12px}
  .ledger{border:1px solid var(--edge);border-radius:10px;overflow:hidden;background:#fff}
  .lhead{display:flex;padding:8px 12px;font-size:12px;color:var(--ink-faint);border-bottom:1px solid var(--rule)}
  .lhead .c1{flex:0 0 52px}.lhead .c2{flex:1 1 auto}.lhead .c3{flex:0 0 88px;text-align:right}
  .row{display:flex;align-items:center;gap:10px;padding:9px 12px;border-bottom:1px solid var(--grid);cursor:pointer}
  .row:last-child{border-bottom:none}
  .row:active{background:var(--paper-2)}
  .r-date{flex:0 0 42px;font-size:12.5px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
  .r-mid{flex:1 1 auto;min-width:0}
  .r-sum{font-size:15.5px;font-weight:700;font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:6px}
  .r-note{font-size:12.5px;color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .r-meta{font-size:11px;color:var(--ink-faint);margin-top:1px}
  .r-bal{flex:0 0 82px;text-align:right;font-size:14px;font-variant-numeric:tabular-nums;color:var(--ink-soft)}
  .r-bal.neg{color:var(--red)}
  .pending{color:var(--amber)}
  .zero{color:var(--ink-faint);font-weight:400}
  .empty{padding:34px 18px;text-align:center;color:var(--ink-soft);font-size:14px}
  .empty b{display:block;font-family:var(--serif);font-size:18px;color:var(--ink);margin-bottom:6px;font-weight:700}

  .gridwrap{overflow-x:auto;border:1px solid var(--edge);border-radius:10px;background:#fff}
  table{border-collapse:collapse;width:100%;min-width:640px;font-size:13px}
  th,td{padding:8px 10px;text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
  th:first-child,td:first-child{text-align:left}
  thead th{font-size:11.5px;color:var(--ink-faint);font-weight:600;border-bottom:1px solid var(--rule);
           position:sticky;top:0;background:#fff}
  tbody td{border-bottom:1px solid var(--grid)}
  tbody tr:nth-child(even) td{background:#FCFBF7}
  td.bal{font-weight:700;color:var(--green)}
  td.bal.neg{color:var(--red)}
  tfoot td{border-top:1px solid var(--rule);font-weight:700}

  .block{border:1px solid var(--edge);border-radius:10px;background:#fff;padding:14px;margin-bottom:12px}
  .block h2{font-family:var(--serif);font-size:17px;margin:0 0 12px;font-weight:700}
  .stat{margin-bottom:14px}.stat:last-child{margin-bottom:0}
  .stat-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:14px}
  .stat-name{display:flex;align-items:center;gap:7px}
  .stat-val{font-weight:700;font-variant-numeric:tabular-nums}
  .bar{height:5px;border-radius:3px;background:var(--paper-2);margin-top:6px;overflow:hidden}
  .bar i{display:block;height:100%;border-radius:3px}
  .stat-sub{font-size:12px;color:var(--ink-soft);margin-top:5px}
  .kv{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--grid);font-size:14px}
  .kv:last-child{border-bottom:none}
  .kv span{color:var(--ink-soft)}
  .kv b{font-variant-numeric:tabular-nums}
  .diff-ok{color:var(--green)}.diff-bad{color:var(--red)}

  label{display:block;font-size:12.5px;color:var(--ink-soft);margin:0 0 5px}
  input,select{width:100%;font-family:inherit;font-size:16px;color:var(--ink);background:#fff;
    border:1px solid var(--edge);border-radius:9px;padding:11px 12px;outline:none}
  input:focus,select:focus{border-color:var(--blue)}
  .field{margin-bottom:12px}
  .two{display:flex;gap:10px}.two>*{flex:1 1 0;min-width:0}
  .btn{width:100%;border:none;border-radius:10px;padding:13px;font-size:15px;font-weight:600;
       font-family:inherit;background:var(--ink);color:var(--paper);cursor:pointer}
  .btn:active{opacity:.85}
  .btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--edge)}
  .btn.danger{background:#fff;color:var(--red);border:1px solid var(--edge)}
  .btn+.btn{margin-top:8px}
  .picker{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
  .picker.two-col{grid-template-columns:repeat(2,1fr)}
  .pick{border:1px solid var(--edge);background:#fff;border-radius:9px;padding:9px 6px;font-size:13px;
        font-family:inherit;color:var(--ink-soft);cursor:pointer;display:flex;flex-direction:column;
        align-items:center;gap:5px}
  .pick.on{border-width:2px;padding:8px 5px;color:var(--ink);font-weight:600;background:var(--paper-2)}
  .quick{display:flex;gap:6px;margin-top:8px}
  .quick button{flex:1;border:1px solid var(--edge);background:#fff;border-radius:9px;padding:9px 4px;
                font-size:13px;font-family:inherit;color:var(--ink);cursor:pointer}
  .quick button:active{background:var(--paper-2)}
  .hint{font-size:12px;color:var(--ink-soft);margin-top:-4px;margin-bottom:12px}
  .err{font-size:13px;color:var(--red);margin-bottom:12px}

  .goal{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--grid);cursor:pointer}
  .goal:last-child{border-bottom:none}
  .gbox{flex:0 0 18px;height:18px;border:2px solid var(--ink-faint);border-radius:5px;margin-top:2px;
        display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff}
  .gbox.done{background:var(--green);border-color:var(--green)}
  .gmid{flex:1 1 auto;min-width:0}
  .gtitle{font-size:14.5px}
  .gtitle.done{color:var(--ink-faint);text-decoration:line-through}
  .gdue{font-size:12px;color:var(--ink-soft);margin-top:2px}
  .gdue.late{color:var(--red);font-weight:600}
  .gdue.soon{color:var(--amber)}

  .tabbar{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--paper);
    border-top:1px solid var(--edge);padding:8px 10px calc(8px + env(safe-area-inset-bottom));
    display:flex;gap:5px;max-width:620px;margin:0 auto}
  .tabbar[hidden]{display:none}
  .tab{flex:1 1 0;border:1px solid transparent;background:transparent;border-radius:9px;padding:9px 2px;
       font-size:12.5px;font-family:inherit;color:var(--ink-soft);cursor:pointer;white-space:nowrap}
  .tab.on{background:#fff;border-color:var(--edge);color:var(--ink);font-weight:600}
  .add{flex:0 0 44px;background:var(--ink);color:var(--paper);border:none;border-radius:9px;
       font-size:23px;line-height:1;cursor:pointer}

  .aiList{margin:8px 0 12px;display:flex;flex-direction:column;gap:8px}
  .cb{max-width:88%;padding:8px 11px;border-radius:12px;font-size:14.5px;line-height:1.35;border:1px solid var(--edge);background:#fff;word-break:break-word}
  .cb.me{align-self:flex-end;background:var(--paper-2)}
  .cb.bot{align-self:flex-start}
  .cb-time{font-size:10.5px;color:var(--ink-faint);margin-top:3px;text-align:right}
  .cb-day{align-self:center;font-size:11px;color:var(--ink-faint);margin:4px 0}
  .cb-act{margin-top:7px;padding-top:7px;border-top:1px dashed var(--edge);font-size:13.5px}
  .cb-act.first{margin-top:0;padding-top:0;border-top:none}
  .cb-sum{margin-bottom:6px}
  .cb-st{font-size:12.5px;font-weight:600}
  .cb-st.ok{color:var(--green)}.cb-st.no{color:var(--ink-faint)}.cb-st.bad{color:var(--red)}
  .abtns{display:flex;gap:8px}
  .abtns button{flex:1;border-radius:9px;padding:9px;font-size:14px;font-weight:600;font-family:inherit;cursor:pointer;border:1px solid var(--edge);background:#fff;color:var(--ink)}
  .abtns button.ok{background:var(--green);border-color:var(--green);color:#fff}
  .abtns button:disabled{opacity:.5}
  textarea{width:100%;font-family:inherit;font-size:16px;color:var(--ink);background:#fff;border:1px solid var(--edge);border-radius:9px;padding:11px 12px;outline:none;resize:vertical;margin-bottom:8px}
  textarea:focus{border-color:var(--blue)}
  .badge{display:inline-block;min-width:15px;height:15px;line-height:15px;border-radius:8px;background:var(--red);color:#fff;font-size:10px;font-weight:700;margin-left:4px;padding:0 4px;vertical-align:top}
  .badge[hidden]{display:none}
  .tokrow{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--grid);font-size:13.5px}
  .tokrow:last-child{border-bottom:none}
  .tokrow .tn{flex:1 1 auto;min-width:0}
  .tokrow .tm{font-size:11.5px;color:var(--ink-faint)}
  .tokrow button{flex:0 0 auto;border:1px solid var(--edge);background:#fff;color:var(--red);border-radius:8px;padding:6px 10px;font-size:12.5px;font-family:inherit;cursor:pointer}
  .tokbox{border:1px solid var(--amber);border-radius:9px;padding:10px;margin:10px 0;background:var(--paper-2);font-size:13px}
  .mono{font-family:ui-monospace,Menlo,monospace;font-size:12px;word-break:break-all;margin:6px 0}

  .scrim{position:fixed;inset:0;background:rgba(22,32,43,.42);z-index:50;display:flex;
         align-items:flex-end;justify-content:center}
  .scrim[hidden]{display:none}
  .modal{width:100%;max-width:620px;background:var(--paper);border-radius:16px 16px 0 0;
    padding:16px 16px calc(16px + env(safe-area-inset-bottom));max-height:92vh;overflow-y:auto}
  .modal h3{font-family:var(--serif);font-size:19px;margin:0 0 14px;font-weight:700}
  .mclose{float:right;border:none;background:transparent;font-size:22px;color:var(--ink-soft);cursor:pointer;padding:0 4px}
  .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:86px;z-index:60;background:var(--ink);
         color:var(--paper);padding:10px 16px;border-radius:9px;font-size:13.5px;max-width:88%}
  .toast[hidden]{display:none}

  .signin{max-width:400px;margin:0 auto;padding:56px 16px 24px}
  .signin h1{font-family:var(--serif);font-size:30px;margin:0 0 6px;font-weight:700}
  .signin p.lead{color:var(--ink-soft);font-size:14px;margin:0 0 24px}
  .signin .block{background:#fff}
  .swap{background:none;border:none;color:var(--blue);font-family:inherit;font-size:13.5px;
        cursor:pointer;padding:10px 0 0;width:100%}
  :focus-visible{outline:2px solid var(--blue);outline-offset:2px}
</style>
</head>
<body class="sheet-paper">

<header id="hdr" hidden>
  <div class="wrap">
    <div class="purse">
      <div class="purse-left">
        <div class="purse-label">Курс</div>
        <div class="rate-num" id="rateNum"></div>
        <div class="rate-sub" id="rateSub"></div>
        <div class="purse-label">Всего</div>
        <div class="total-num" id="totalNum">0</div>
        <div class="total-sub" id="totalSub"></div>
      </div>
      <div class="purse-right">
        <div class="purse-label">Осталось на руках</div>
        <div id="purseRows"></div>
      </div>
    </div>
    <div class="sync" id="sync"></div>
    <div class="month" id="monthBar">
      <button class="mbtn" id="prevM" aria-label="Предыдущий месяц">‹</button>
      <b id="monthName"></b>
      <button class="mbtn" id="nextM" aria-label="Следующий месяц">›</button>
    </div>
    <div class="chips" id="chips"></div>
  </div>
</header>

<main class="wrap" id="view"></main>

<div class="tabbar" id="tabbar" hidden>
  <button class="tab on" data-tab="book">Тетрадь</button>
  <button class="tab" data-tab="goals">Цели</button>
  <button class="tab" data-tab="sums">Итоги</button>
  <button class="tab" data-tab="ai">ИИ<span class="badge" id="aiBadge" hidden></span></button>
  <button class="tab" data-tab="set">Ещё</button>
  <button class="add" id="addBtn" aria-label="Добавить">+</button>
</div>

<div class="scrim" id="scrim" hidden><div class="modal" id="modal"></div></div>
<div class="toast" id="toast" hidden></div>

<script>

  { id:"real", name:"Реализация", short:"Реализ.", color:"var(--blue)",   sign:-1 },

  { id:"auto", name:"Машина",     short:"Машина",  color:"var(--red)",    sign:-1 }
];
/* обмен хранится парой записей: cout (списание) и cin (зачисление) с общим conv_id */
const CONV_COLS = [
  { id:"cout", name:"Обмен (списано)",  short:"Обмен", color:"var(--ink-soft)", sign:-1, conv:true },
  { id:"cin",  name:"Обмен (получено)", short:"Обмен", color:"var(--ink-soft)", sign:+1, conv:true }
];
/* выплата себе: отдельная запись, не входит ни в приход, ни в обычные расходы */

                      || (id==="self" ? SELF_COL : null) || COLS[0];

/* ---------- сеть ---------- */
async function authFetch(path, opts){
  const o = opts||{};
  const r = await fetch(SUPABASE_URL+path, {
    method:o.method||"GET",
    headers:Object.assign({apikey:SUPABASE_KEY,"Content-Type":"application/json"}, o.headers||{}),
    body:o.body?JSON.stringify(o.body):undefined
  });
  const text = await r.text();
  let data=null; try{ data = text?JSON.parse(text):null; }catch(e){ data=text; }
  if(!r.ok){
    const msg=(data&&(data.error_description||data.msg||data.message||data.error))||("Ошибка "+r.status);
    const err=new Error(msg); err.status=r.status; err.data=data; throw err;
  }
  return data;
}
async function api(path, opts){
  await ensureToken();
  const o=opts||{};
  o.headers=Object.assign({Authorization:"Bearer "+session.access_token}, o.headers||{});
  try{ return await authFetch(path,o); }
  catch(e){
    if(e.status===401){ await refreshToken(); o.headers.Authorization="Bearer "+session.access_token;
      return await authFetch(path,o); }
    throw e;
  }
}
async function ensureToken(){
  if(!session) throw new Error("Нет входа");
  if(session.expires_at && Date.now() > session.expires_at-60000) await refreshToken();
}
async function refreshToken(){
  const d=await authFetch("/auth/v1/token?grant_type=refresh_token",
    {method:"POST", body:{refresh_token:session.refresh_token}});
  saveSession(d);
}
function saveSession(d){
  session={ access_token:d.access_token, refresh_token:d.refresh_token,
    expires_at:Date.now()+(d.expires_in||3600)*1000,
    email:(d.user&&d.user.email)||(session&&session.email)||"",
    user_id:(d.user&&d.user.id)||(session&&session.user_id)||"" };
  LS.set(K_SESSION, JSON.stringify(session));
}
async function signIn(email,password){
  saveSession(await authFetch("/auth/v1/token?grant_type=password",{method:"POST",body:{email,password}}));
}
async function signUp(email,password){
  const d=await authFetch("/auth/v1/signup",{method:"POST",body:{email,password}});
  if(d&&d.access_token){ saveSession(d); return true; }
  return false;
}
function signOut(){
  session=null; LS.del(K_SESSION); LS.del(K_CACHE); LS.del(K_QUEUE);
  S={ entries:[], goals:[], settings:{ starts:{}, base:"USD", rate:12600,
      rateSource:"cbu", notifyTime:"21:00", checks:{}, payPct:10, payBase:"all" } };

}

function normEntry(e){
  return { id:e.id, date:e.date, col:e.col, amount:Number(e.amount), cur:e.cur,
           wallet:e.wallet||"cash_uzs", note:e.note||"", source:e.source||"user",
           conv_id:e.conv_id||null, rate:(e.rate==null?null:Number(e.rate)),
           created_at:e.created_at||"", updated_at:e.updated_at||e.created_at||"" };
}
function normGoal(g){
  return { id:g.id, title:g.title, due:g.due||"", done:!!g.done, notify:g.notify!==false,
           source:g.source||"user", created_at:g.created_at||"", updated_at:g.updated_at||"" };
}
async function pullAll(){
  const rows = await api("/rest/v1/entries?select=*&order=date.asc,created_at.asc");
  S.entries = (rows||[]).map(normEntry);
  const gs = await api("/rest/v1/goals?select=*&order=due.asc");
  S.goals = (gs||[]).map(normGoal);
  const st = await api("/rest/v1/settings?select=*&limit=1");
  if(st && st.length){
    const s=st[0];
    S.settings = { starts:s.starts||{}, base:s.base_cur||"USD", rate:Number(s.rate)||12600,
      rateSource:s.rate_source||"cbu", notifyTime:s.notify_time||"21:00", checks:s.checks||{},
      payPct:Number(s.pay_pct)||10, payBase:s.pay_base||"all" };
  } else { await pushSettings(); }
  cacheSave();
}
async function pushSettings(){
  const s=S.settings;
  await api("/rest/v1/settings",{ method:"POST",
    body:[{ user_id:session.user_id, starts:s.starts, base_cur:s.base, rate:s.rate,
            rate_source:s.rateSource, notify_time:s.notifyTime, checks:s.checks,
            pay_pct:s.payPct||10, pay_base:s.payBase||"all",
            start_amount:0, start_cur:"USD" }],
    headers:{Prefer:"resolution=merge-duplicates,return=minimal"} });
}
async function flushQueue(){
  if(!queue.length || !session) return;
  const rest=[];
  for(const op of queue){
    try{
      if(op.kind==="insert")
        await api("/rest/v1/entries",{method:"POST",body:[op.row],
          headers:{Prefer:"resolution=merge-duplicates,return=minimal"}});
      else if(op.kind==="update")
        await api("/rest/v1/entries?id=eq."+op.id,{method:"PATCH",body:op.row,
          headers:{Prefer:"return=minimal"}});
      else if(op.kind==="delete")
        await api("/rest/v1/entries?id=eq."+op.id,{method:"DELETE",headers:{Prefer:"return=minimal"}});
      else if(op.kind==="goal_insert")
        await api("/rest/v1/goals",{method:"POST",body:[op.row],
          headers:{Prefer:"resolution=merge-duplicates,return=minimal"}});
      else if(op.kind==="goal_update")
        await api("/rest/v1/goals?id=eq."+op.id,{method:"PATCH",body:op.row,
          headers:{Prefer:"return=minimal"}});
      else if(op.kind==="goal_delete")
        await api("/rest/v1/goals?id=eq."+op.id,{method:"DELETE",headers:{Prefer:"return=minimal"}});
      else if(op.kind==="settings") await pushSettings();
    }catch(e){
      if(e.status && e.status>=400 && e.status<500 && e.status!==401 && e.status!==429) continue;
      rest.push(op);
    }
  }
  queue=rest; queueSave();
}

}

/* ---------- деньги ---------- */
function toBase(amount,cur){
  const s=S.settings;
  if(cur===s.base) return amount;
  if(s.base==="USD"&&cur==="UZS") return amount/(s.rate||1);
  if(s.base==="UZS"&&cur==="USD") return amount*(s.rate||1);
  return amount;
}
function fmt(n,cur){
  const c=cur||S.settings.base, v=Math.abs(n);
  let str;
  if(c==="USD") str="$"+(Math.round(v*100)/100).toLocaleString("ru-RU",
    {minimumFractionDigits:(Math.round(v*100)/100)%1?2:0,maximumFractionDigits:2});
  else str=Math.round(v).toLocaleString("ru-RU").replace(/\u00A0/g," ")+" сум";
  return (n<0?"−":"")+str;
}
function fmtNum(n,cur){
  const c=cur||S.settings.base, v=Math.abs(n);
  let str;
  if(c==="USD") str="$"+(Math.round(v*100)/100).toLocaleString("ru-RU",
    {minimumFractionDigits:(Math.round(v*100)/100)%1?2:0,maximumFractionDigits:2});
  else str=Math.round(v).toLocaleString("ru-RU").replace(/\u00A0/g," ");
  return (n<0?"−":"")+str;
}
function fmtShort(n){ return fmtShortCur(n, S.settings.base); }
function fmtShortCur(n,c){
  const a=Math.abs(n);
  let str;
  if(c==="USD") str="$"+(a>=1000?Math.round(a).toLocaleString("ru-RU").replace(/\u00A0/g," ")
    :(Math.round(a*100)/100).toLocaleString("ru-RU"));
  else{
    if(a>=1e6) str=(Math.round(a/1e5)/10).toLocaleString("ru-RU")+" млн";
    else if(a>=1000) str=Math.round(a/1000).toLocaleString("ru-RU").replace(/\u00A0/g," ")+" т";
    else str=String(Math.round(a));
  }
  return (n<0?"−":"")+str;
}
function parseAmount(raw){
  if(raw===0||raw==="0") return {amount:0,cur:null};
  if(!raw) return null;
  let t=String(raw).trim().toLowerCase().replace(/\s+/g,"").replace(/,/g,".");
  let cur=null;
  if(t.includes("$")){ cur="USD"; t=t.replace(/\$/g,""); }
  let mult=1;
  if(/(млн|mln|m)$/.test(t)){ mult=1e6; t=t.replace(/(млн|mln|m)$/,""); }
  else if(/(тыс|т|k|к)$/.test(t)){ mult=1e3; t=t.replace(/(тыс|т|k|к)$/,""); }
  const n=parseFloat(t);
  if(!isFinite(n)) return null;
  return { amount:Math.abs(n)*mult, cur };
}

/* ---------- расчёты ---------- */
function sortedEntries(){
  return S.entries.slice().sort((a,b)=>
    a.date===b.date ? String(a.created_at).localeCompare(String(b.created_at)) : (a.date<b.date?-1:1));
}
function walletBalance(wid){
  const w=walletById(wid);
  let v=Number(S.settings.starts[wid]||0);
  S.entries.forEach(e=>{ if(e.wallet===wid) v+=colById(e.col).sign*e.amount; });
  return v;
}
function totalBase(){
  return WALLETS.reduce((s,w)=>s+toBase(walletBalance(w.id), w.cur), 0);
}
function withRunning(){
  let run=WALLETS.reduce((s,w)=>s+toBase(Number(S.settings.starts[w.id]||0), w.cur),0);
  return sortedEntries().map(e=>{
    run+=colById(e.col).sign*toBase(e.amount, walletById(e.wallet).cur);
    return Object.assign({},e,{run});
  });
}
/* все записи месяца, включая обе половины обмена (для расчётов) */
function rawMonth(ym){ return withRunning().filter(e=>e.date.slice(0,7)===ym); }
/* записи месяца для показа: пара обмена сливается в одну строку */
function monthEntries(ym){
  const raw=rawMonth(ym), out=[], seen={};
  raw.forEach(e=>{
    if(!isConv(e) || !e.conv_id){ out.push(e); return; }
    if(seen[e.conv_id]) return;
    const pair=raw.filter(x=>x.conv_id===e.conv_id);
    const o=pair.find(x=>x.col==="cout"), i=pair.find(x=>x.col==="cin");
    seen[e.conv_id]=true;
    if(o && i) out.push({ conv:true, id:o.id, conv_id:e.conv_id, date:o.date, out:o, inn:i,
      run:raw.indexOf(i)>raw.indexOf(o)?i.run:o.run,
      note:o.note||i.note||"", rate:o.rate||i.rate||null, source:o.source,
      created_at:o.created_at, updated_at:o.updated_at>i.updated_at?o.updated_at:i.updated_at });
    else out.push(e);
  });
  return out;
}
/* обмены не входят ни в приход, ни в расход */
function monthTotals(ym){
  const t={}; COLS.forEach(c=>t[c.id]=0);
  rawMonth(ym).forEach(e=>{ if(isConv(e) || !(e.col in t)) return;
    t[e.col]+=toBase(e.amount, walletById(e.wallet).cur); });
  return t;
}
/* по дням: приход, расход (без обменов) и остаток каждого кошелька на конец дня */
function dayMap(){
  const bal={}; WALLETS.forEach(w=>bal[w.id]=Number(S.settings.starts[w.id]||0));
  const days={}, list=sortedEntries();
  list.forEach((e,idx)=>{
    const c=colById(e.col), d=days[e.date]||(days[e.date]={inc:0,spent:0,bal:null});
    bal[e.wallet]=(bal[e.wallet]||0)+c.sign*e.amount;
    if(e.col==="self"){ d.self=(d.self||0)+toBase(e.amount, walletById(e.wallet).cur); }
    else if(!isConv(e)){
      const v=toBase(e.amount, walletById(e.wallet).cur);
      if(c.sign>0) d.inc+=v; else d.spent+=v;
    }
    const next=list[idx+1];
    if(!next || next.date!==e.date) d.bal=Object.assign({},bal);
  });
  return days;
}
function totalOfBal(bal){ return WALLETS.reduce((s,w)=>s+toBase(bal[w.id]||0,w.cur),0); }
const WD=["вс","пн","вт","ср","чт","пт","сб"];
function dayLabel(iso){
  const d=new Date(iso+"T00:00:00");
  return String(d.getDate()).padStart(2,"0")+" "+MONTHS[d.getMonth()].slice(0,3).toLowerCase()+", "+WD[d.getDay()];
}
function topNotes(ym,colId){
  const map={};
  monthEntries(ym).filter(e=>e.col===colId&&e.note&&e.amount>0).forEach(e=>{
    const k=e.note.trim().toLowerCase();
    map[k]=(map[k]||0)+toBase(e.amount, walletById(e.wallet).cur);
  });
  return Object.entries(map).sort((a,b)=>b[1]-a[1]).slice(0,3);
}
function shiftMonth(ym,d){
  let [y,m]=ym.split("-").map(Number);
  m+=d; if(m<1){m=12;y--;} if(m>12){m=1;y++;}
  return y+"-"+String(m).padStart(2,"0");
}
function daysLeft(due){
  if(!due) return null;
  const a=new Date(todayISO()+"T00:00:00"), b=new Date(due+"T00:00:00");
  return Math.round((b-a)/86400000);
}

/* ---------- напоминания ---------- */
async function askNotify(){
  if(!("Notification" in window)) { toast("Устройство не умеет уведомления"); return; }
  const p=await Notification.requestPermission();
  toast(p==="granted"?"Уведомления включены":"Уведомления не разрешены");
  render();
}
function notify(title, body){
  if(!("Notification" in window) || Notification.permission!=="granted") return;
  try{
    if(navigator.serviceWorker && navigator.serviceWorker.ready)
      navigator.serviceWorker.ready.then(r=>r.showNotification(title,{body,icon:"./icon-192.png",tag:"ezh"}));
    else new Notification(title,{body,icon:"./icon-192.png"});
  }catch(e){}
}
function checkReminders(){
  if(!session) return;
  let marks={}; try{ marks=JSON.parse(LS.get(K_NOTIFIED)||"{}"); }catch(e){}
  const today=todayISO();

  const [hh,mm]=(S.settings.notifyTime||"21:00").split(":").map(Number);
  const now=new Date();
  const past = now.getHours()>hh || (now.getHours()===hh && now.getMinutes()>=mm);
  /* считаем запись «за сегодня», если она внесена сегодня, даже на другую дату */
  const hasToday = S.entries.some(e=>e.date===today ||
    (e.created_at && !isNaN(new Date(e.created_at)) && localISO(new Date(e.created_at))===today));
  if(past && !hasToday && marks.day!==today){
    notify("Ежедневник", "За сегодня нет ни одной записи");
    marks.day=today;
  }

  const due = S.goals.filter(g=>!g.done && g.notify && g.due && daysLeft(g.due)<=0);
  if(due.length && marks.goals!==today){
    const late=due.filter(g=>daysLeft(g.due)<0).length;
    notify("Цели", late?("Просрочено целей: "+late):("Сегодня срок: "+due[0].title));
    marks.goals=today;
  }
  LS.set(K_NOTIFIED, JSON.stringify(marks));
}

function dayHead(date, info){
  const el=document.createElement("div"); el.className="dayhead";
  let flow="";
  if(info){
    if(info.inc>0) flow+='<b style="color:var(--green)">+'+fmtShort(info.inc)+'</b>';
    if(info.spent>0) flow+=(flow?" &nbsp;":"")+'<b style="color:var(--red)">−'+fmtShort(info.spent)+'</b>';
    if(info.self>0) flow+=(flow?" &nbsp;":"")+'<b style="color:var(--teal)">себе −'+fmtShort(info.self)+'</b>';
  }
  if(!flow) flow='<span style="color:var(--ink-faint)">без прихода и расхода</span>';
  let wal="";
  if(info && info.bal) WALLETS.forEach(w=>{
    const v=info.bal[w.id]||0;
    wal+='<span>'+ico(walletIcon(w),"var(--ink-faint)",13)+w.short+' <b class="'+(v<0?"neg":"")+'">'+fmtNum(v,w.cur)+'</b></span>';
  });
  el.innerHTML='<div class="dh-top"><div class="dh-date">'+dayLabel(date)+'</div><div class="dh-flow">'+flow+'</div></div>'+
    (wal?'<div class="dh-wal" title="Остаток на конец дня">'+wal+'</div>':"");
  return el;
}
function metaOf(e){
  let meta="";

  if(e.updated_at && e.created_at && e.updated_at!==e.created_at)
    meta+=(meta?" · ":"")+"изм. "+dmy(e.updated_at)+" "+hhmm(e.updated_at);
  const ids=e.conv ? [e.out.id,e.inn.id] : [e.id];
  if(ids.some(isPending)) meta+=(meta?" · ":"")+'<span class="pending">не отправлено</span>';
  return meta;

function goalRow(g){
  const row=document.createElement("div"); row.className="goal";
  const bx=document.createElement("div");
  bx.className="gbox"+(g.done?" done":"");
  bx.textContent=g.done?"✓":"";
  bx.onclick=ev=>{ ev.stopPropagation(); toggleGoal(g.id); };
  const mid=document.createElement("div"); mid.className="gmid";
  const dl=daysLeft(g.due);
  let due="", cls="";
  if(g.done) due = g.updated_at?("закрыто "+dmy(g.updated_at)):"закрыто";
  else if(!g.due) due="без даты";
  else if(dl<0){ due="просрочено на "+Math.abs(dl)+" дн · "+g.due.split("-").reverse().join("."); cls=" late"; }
  else if(dl===0){ due="срок сегодня"; cls=" late"; }
  else if(dl<=7){ due="осталось "+dl+" дн"; cls=" soon"; }
  else due="до "+g.due.split("-").reverse().join(".");
  mid.innerHTML='<div class="gtitle'+(g.done?" done":"")+'">'+escapeHtml(g.title)+'</div>'+
                '<div class="gdue'+cls+'">'+due+(g.source==="ai"?" · ✦":"")+'</div>';
  mid.onclick=()=>openGoal(g.id);
  row.appendChild(bx); row.appendChild(mid);
  return row;
}
function toggleGoal(id){
  const g=S.goals.find(x=>x.id===id); if(!g) return;
  g.done=!g.done; g.updated_at=nowISO();
  cacheSave(); enqueue({kind:"goal_update", id:g.id, row:{done:g.done, updated_at:g.updated_at}});
  render(); flushThen();
}
let gdraft=null;
function openGoal(id){
  const g = id ? S.goals.find(x=>x.id===id) : null;
  gdraft = g ? {id:g.id,title:g.title,due:g.due,notify:g.notify}
             : {id:null,title:"",due:"",notify:true};
  const m=$("#modal");
  m.innerHTML='<button class="mclose" id="mClose">×</button><h3>'+(g?"Цель":"Новая цель")+'</h3>'+
    '<div class="field"><label for="gT">Что сделать</label>'+
      '<input id="gT" value="'+escapeHtml(gdraft.title)+'" placeholder="купить аппарат"></div>'+
    '<div class="field"><label for="gD">Срок</label><input id="gD" type="date" value="'+gdraft.due+'"></div>'+
    '<div class="field"><label for="gN">Напоминать о сроке</label>'+
      '<select id="gN"><option value="1"'+(gdraft.notify?" selected":"")+'>да</option>'+
      '<option value="0"'+(!gdraft.notify?" selected":"")+'>нет</option></select></div>';
  const ok=document.createElement("button");
  ok.className="btn"; ok.textContent=g?"Сохранить":"Записать";
  ok.onclick=commitGoal; m.appendChild(ok);
  if(g){
    const del=document.createElement("button");
    del.className="btn danger"; del.textContent="Удалить цель";
    del.onclick=()=>{ S.goals=S.goals.filter(x=>x.id!==g.id);
      enqueue({kind:"goal_delete", id:g.id}); cacheSave(); closeModal(); render(); flushThen(); };
    m.appendChild(del);
  }
  m.querySelector("#mClose").onclick=closeModal;
  $("#scrim").hidden=false;
  setTimeout(()=>{ const t=m.querySelector("#gT"); if(t&&!gdraft.title) t.focus(); },30);
}
function commitGoal(){
  const m=$("#modal");
  const title=m.querySelector("#gT").value.trim();
  if(!title){ toast("Впиши, что сделать"); return; }
  const due=m.querySelector("#gD").value||null;
  const notify=m.querySelector("#gN").value==="1";
  if(gdraft.id){
    const g=S.goals.find(x=>x.id===gdraft.id);
    Object.assign(g,{title,due:due||"",notify,updated_at:nowISO()});
    enqueue({kind:"goal_update", id:g.id, row:{title,due,notify,updated_at:g.updated_at}});
  }else{
    const row={id:uuid(),title,due:due||"",done:false,notify,source:"user",
               created_at:nowISO(),updated_at:nowISO()};
    S.goals.push(row);
    enqueue({kind:"goal_insert", id:row.id,
             row:{id:row.id,title,due,done:false,notify,source:"user"}});
  }
  cacheSave(); closeModal(); render(); flushThen();
}

/* ---------- графики месяца ---------- */
function daysInMonth(ym){ const [y,m]=ym.split("-").map(Number); return new Date(y,m,0).getDate(); }
function lastShownDay(ym){
  const n=daysInMonth(ym), cur=ymNow();
  if(ym<cur) return n;
  if(ym===cur) return new Date().getDate();
  return 0;
}
function dShort(ym,d){ return String(d).padStart(2,"0")+" "+MONTHS[Number(ym.slice(5,7))-1].slice(0,3).toLowerCase(); }
function svgEl(w,h,inner){ return '<svg viewBox="0 0 '+w+' '+h+'" role="img" preserveAspectRatio="xMidYMid meet">'+inner+'</svg>'; }

function chartBalanceBlock(ym){
  const b=document.createElement("div"); b.className="block";
  const N=lastShownDay(ym);
  if(!N){ b.innerHTML="<h2>Остаток по дням</h2><div class=\"chart-note\">Этот месяц ещё не начался.</div>"; return b; }
  const days=dayMap(), keys=Object.keys(days).sort();
  const first=ym+"-01";
  let open=WALLETS.reduce((a,w)=>a+toBase(Number(S.settings.starts[w.id]||0),w.cur),0);
  keys.forEach(k=>{ if(k<first && days[k].bal) open=totalOfBal(days[k].bal); });
  const vals=[]; let cur=open;
  for(let d=1; d<=N; d++){
    const k=ym+"-"+String(d).padStart(2,"0");
    if(days[k] && days[k].bal) cur=totalOfBal(days[k].bal);
    vals.push(cur);
  }
  const delta=vals[vals.length-1]-open;
  const hasData=keys.some(k=>k.slice(0,7)===ym);
  const W=320,H=150,L=40,R=10,T=12,B=26, pw=W-L-R, ph=H-T-B;
  let mn=Math.min(open,...vals), mx=Math.max(open,...vals);
  if(mx===mn){ mx+=1; mn-=1; }
  const pad=(mx-mn)*0.08; mn-=pad; mx+=pad;
  const X=i=> N===1 ? L+pw/2 : L+pw*i/(N-1), Y=v=> T+ph*(1-(v-mn)/(mx-mn));
  let pts=vals.map((v,i)=>X(i).toFixed(1)+","+Y(v).toFixed(1));
  let g='';
  [mn+pad,(mn+mx)/2,mx-pad].forEach((v,idx)=>{
    g+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(v).toFixed(1)+'" y2="'+Y(v).toFixed(1)+'" stroke="var(--grid)" stroke-width="1"/>'+
       '<text x="'+(L-5)+'" y="'+(Y(v)+3).toFixed(1)+'" text-anchor="end" font-size="9.5" fill="var(--ink-faint)">'+fmtShort(v)+'</text>';
  });
  if(mn<0&&mx>0) g+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(0).toFixed(1)+'" y2="'+Y(0).toFixed(1)+'" stroke="var(--ink-faint)" stroke-dasharray="3 3"/>';
  const area='M'+X(0).toFixed(1)+","+(T+ph)+" L"+pts.join(" L")+" L"+X(N-1).toFixed(1)+","+(T+ph)+" Z";
  g+='<path d="'+area+'" fill="var(--blue)" opacity=".07"/>'+
     '<polyline points="'+pts.join(" ")+'" fill="none" stroke="var(--blue)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>';
  const lx=X(N-1), ly=Y(vals[N-1]);
  g+='<circle id="bcDot" cx="'+lx.toFixed(1)+'" cy="'+ly.toFixed(1)+'" r="4" fill="var(--blue)" stroke="#fff" stroke-width="2"/>';
  g+='<line id="bcLine" x1="'+lx.toFixed(1)+'" x2="'+lx.toFixed(1)+'" y1="'+T+'" y2="'+(T+ph)+'" stroke="var(--ink-faint)" stroke-width="1" opacity="0"/>';
  const ticks=[1]; if(N>=8) ticks.push(Math.round(N/2)); if(N>1) ticks.push(N);
  [...new Set(ticks)].forEach(d=>{
    g+='<text x="'+X(d-1).toFixed(1)+'" y="'+(H-8)+'" text-anchor="middle" font-size="9.5" fill="var(--ink-faint)">'+d+'</text>';
  });
  const hw=N===1?pw:pw/(N-1);
  for(let i=0;i<N;i++){
    g+='<rect class="bar-hit" data-i="'+i+'" x="'+(X(i)-hw/2).toFixed(1)+'" y="'+T+'" width="'+hw.toFixed(1)+'" height="'+ph+'" fill="transparent"/>';
  }
  b.innerHTML='<div class="chart-head"><h2>Остаток по дням</h2>'+
    (hasData?'<div class="chart-delta '+(delta>=0?"up":"down")+'">'+(delta>=0?"+":"−")+fmt(Math.abs(delta))+'</div>':"")+'</div>'+
    '<div class="chart-box">'+svgEl(W,H,g)+'</div>'+
    '<div class="tip" id="bcTip" aria-live="polite">'+
      (hasData?(delta>=0?"За месяц прибавилось, ":"За месяц ушло, ")+"остаток на старте месяца "+fmt(open)
              :"В этом месяце записей ещё нет")+'</div>'+
    '<div class="chart-note">Общий остаток по всем кошелькам в '+(S.settings.base==="USD"?"долларах":"сумах")+' по текущему курсу. Нажми на день, чтобы увидеть цифры.</div>';
  b.querySelectorAll(".bar-hit").forEach(r=>{
    const show=()=>{
      const i=Number(r.dataset.i), v=vals[i], prev=i?vals[i-1]:open, dd=v-prev;
      b.querySelector("#bcDot").setAttribute("cx",X(i).toFixed(1)); b.querySelector("#bcDot").setAttribute("cy",Y(v).toFixed(1));
      const ln=b.querySelector("#bcLine"); ln.setAttribute("x1",X(i).toFixed(1)); ln.setAttribute("x2",X(i).toFixed(1)); ln.setAttribute("opacity","1");
      b.querySelector("#bcTip").textContent=dShort(ym,i+1)+": остаток "+fmt(v)+" ("+(dd>=0?"+":"−")+fmt(Math.abs(dd))+" за день)";
    };
    r.addEventListener("mouseenter",show); r.addEventListener("click",show);
  });
  return b;
}

function chartSpendBlock(ym){
  const b=document.createElement("div"); b.className="block";
  const n=daysInMonth(ym), N=lastShownDay(ym)||n;
  const cats=COLS.filter(c=>c.sign<0);
  const per=Array.from({length:n},()=>({real:0,byt:0,lich:0,auto:0,sum:0}));
  rawMonth(ym).forEach(e=>{ if(isConv(e)||e.col==="self"||!(e.col in per[0])||colById(e.col).sign>0) return;
    const d=Number(e.date.slice(8,10))-1, v=toBase(e.amount,walletById(e.wallet).cur);
    per[d][e.col]+=v; per[d].sum+=v; });
  const total=per.reduce((a,x)=>a+x.sum,0);
  if(!total){ b.innerHTML="<h2>Расходы по дням</h2><div class=\"chart-note\">Расходов за этот месяц ещё нет.</div>"; return b; }
  const W=320,H=150,L=40,R=10,T=12,B=26, pw=W-L-R, ph=H-T-B;
  const mx=Math.max(...per.map(x=>x.sum));
  const slot=pw/n, bw=Math.max(3,Math.min(14,slot*0.62));
  const Y=v=>T+ph*(1-v/mx);
  let g='';
  [0,mx/2,mx].forEach(v=>{
    g+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(v).toFixed(1)+'" y2="'+Y(v).toFixed(1)+'" stroke="'+(v===0?"var(--ink-faint)":"var(--grid)")+'" stroke-width="1"/>'+
       '<text x="'+(L-5)+'" y="'+(Y(v)+3).toFixed(1)+'" text-anchor="end" font-size="9.5" fill="var(--ink-faint)">'+fmtShort(v)+'</text>';
  });
  per.forEach((x,i)=>{
    const cx=L+slot*(i+0.5); let acc=0;
    cats.forEach(c=>{
      const v=x[c.id]; if(!v) return;
      const y1=Y(acc+v), y0=Y(acc); acc+=v;
      g+='<rect x="'+(cx-bw/2).toFixed(1)+'" y="'+y1.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+Math.max(0.5,(y0-y1)).toFixed(1)+
         '" rx="1.5" fill="'+CHART_COL[c.id]+'" stroke="#fff" stroke-width="1.2"/>';
    });
    g+='<rect class="bar-hit" data-i="'+i+'" x="'+(cx-slot/2).toFixed(1)+'" y="'+T+'" width="'+slot.toFixed(1)+'" height="'+ph+'" fill="transparent"/>';
  });
  const ticks=[...new Set([1,Math.round(n/2),n])];
  ticks.forEach(d=>{
    g+='<text x="'+(L+slot*(d-0.5)).toFixed(1)+'" y="'+(H-8)+'" text-anchor="middle" font-size="9.5" fill="var(--ink-faint)">'+d+'</text>';
  });
  const topI=per.reduce((bi,x,i)=>x.sum>per[bi].sum?i:bi,0);
  b.innerHTML='<div class="chart-head"><h2>Расходы по дням</h2><div class="chart-delta" style="color:var(--ink)">'+fmt(total)+'</div></div>'+
    '<div class="chart-box">'+svgEl(W,H,g)+'</div>'+
    '<div class="legend">'+cats.map(c=>'<span><i style="background:'+CHART_COL[c.id]+'"></i>'+c.name+'</span>').join("")+'</div>'+
    '<div class="tip" id="spTip" aria-live="polite">Больше всего ушло '+dShort(ym,topI+1)+': '+fmt(per[topI].sum)+'</div>'+
    '<div class="chart-note">Обмены сюда не входят. Нажми на столбик, чтобы увидеть, на что ушёл день.</div>';
  b.querySelectorAll(".bar-hit").forEach(r=>{
    const show=()=>{
      const i=Number(r.dataset.i), x=per[i];
      const parts=cats.filter(c=>x[c.id]>0).map(c=>c.short+" "+fmt(x[c.id]));
      b.querySelector("#spTip").textContent=dShort(ym,i+1)+": "+(x.sum?("всего "+fmt(x.sum)+" · "+parts.join(" · ")):"расходов не было");
    };
    r.addEventListener("mouseenter",show); r.addEventListener("click",show);
  });
  return b;
}

/* ---------- плачу себе ---------- */
function payPct(){ const v=Number(S.settings.payPct); return v>=1&&v<=100?v:10; }
function payBase(){ return S.settings.payBase==="real"?"real":"all"; }
function fromBase(v,cur){
  const s=S.settings;
  if(cur===s.base) return v;
  if(s.base==="USD"&&cur==="UZS") return v*(s.rate||1);
  if(s.base==="UZS"&&cur==="USD") return v/(s.rate||1);
  return v;
}
function profitMonth(ym){
  const t=monthTotals(ym);
  const spent = payBase()==="real" ? t.real : COLS.filter(c=>c.sign<0).reduce((a,c)=>a+t[c.id],0);
  return t.in-spent;
}
function selfSum(list){ return list.filter(e=>e.col==="self").reduce((a,e)=>a+toBase(e.amount,walletById(e.wallet).cur),0); }
function paidSelf(ym){ return selfSum(rawMonth(ym)); }
function dueSelf(ym){ return Math.max(0,profitMonth(ym))*payPct()/100; }

function paySelfBlock(ym){
  const b=document.createElement("div"); b.className="block";
  const profit=profitMonth(ym), due=dueSelf(ym), paid=paidSelf(ym), left=Math.max(0,due-paid);
  const pct=due>0?Math.min(100,Math.round(paid/due*100)):0;
  let opts=""; for(let i=5;i<=15;i++) opts+='<option value="'+i+'"'+(payPct()===i?" selected":"")+'>'+i+'%</option>';
  b.innerHTML='<div class="chart-head"><h2 style="display:flex;align-items:center;gap:8px">'+ico("self","var(--teal)",20)+'Плачу себе</h2>'+
    '<div class="chart-delta" style="color:var(--ink)">'+fmt(due)+'</div></div>'+
    '<div class="two"><div class="field" style="margin-bottom:8px"><label for="psPct">Доля от прибыли</label>'+
      '<select id="psPct">'+opts+'</select></div>'+
    '<div class="field" style="margin-bottom:8px"><label for="psBase">Прибыль = приход</label>'+
      '<select id="psBase"><option value="all"'+(payBase()==="all"?" selected":"")+'>минус все расходы</option>'+
      '<option value="real"'+(payBase()==="real"?" selected":"")+'>минус реализацию</option></select></div></div>'+
    kv("Прибыль месяца",(profit<0?"−":"")+fmt(Math.abs(profit)))+
    kv("Положено себе ("+payPct()+"%)",fmt(due))+
    kv("Уже выплачено",fmt(paid))+
    '<div class="bar selfbar" style="margin:8px 0 4px"><i style="width:'+pct+'%"></i></div>'+
    kv(paid>due&&due>0?"Выплачено сверх доли":"Осталось выплатить",fmt(paid>due?paid-due:left));
  if(profit<=0) b.insertAdjacentHTML("beforeend",'<div class="selfnote">Прибыли в этом месяце нет, платить себе пока не из чего.</div>');
  const btn=document.createElement("button");
  btn.className="btn"; btn.style.marginTop="12px"; btn.textContent="Выплатить себе";
  btn.onclick=()=>openSelf(); b.appendChild(btn);
  const all=selfSum(S.entries);
  b.insertAdjacentHTML("beforeend",'<div class="selfnote">За всё время выплачено себе: <b>'+fmt(all)+
    '</b>. Это отдельная запись «Себе»: она списывает деньги с кошелька, но не считается обычным расходом и не уменьшает прибыль.</div>');
  b.querySelector("#psPct").onchange=ev=>{ S.settings.payPct=Number(ev.target.value);
    cacheSave(); enqueue({kind:"settings"}); flushThen(); render(); };
  b.querySelector("#psBase").onchange=ev=>{ S.settings.payBase=ev.target.value;
    cacheSave(); enqueue({kind:"settings"}); flushThen(); render(); };
  return b;
}

let sdraft=null;
function selfPrefill(){
  const w=walletById(sdraft.wallet);
  const left=Math.max(0,dueSelf(sdraft.month)-paidSelf(sdraft.month));
  return left>0 ? String(roundCur(fromBase(left,w.cur),w.cur)) : "";
}
function openSelf(){
  sdraft={ wallet:"cash_uzs", note:"себе", date:todayISO(), month:ui.month, amount:"", auto:true };
  drawSelf();
}
function readSelf(){
  const m=$("#modal"); if(!m.querySelector("#sAmt")) return;
  sdraft.amount=m.querySelector("#sAmt").value;
  sdraft.note=m.querySelector("#sNote").value;
  sdraft.date=m.querySelector("#sDate").value||todayISO();
}
function drawSelf(){
  const m=$("#modal"); if(sdraft.auto) sdraft.amount=selfPrefill();
  const due=dueSelf(sdraft.month), paid=paidSelf(sdraft.month);
  m.innerHTML='<button class="mclose" id="mClose" aria-label="Закрыть">×</button>'+
    "<h3>Выплата себе</h3>"+
    '<div class="hint" style="margin-top:-6px">Положено за месяц: '+fmt(due)+' · выплачено: '+fmt(paid)+'</div>'+
    '<div class="field"><label>Откуда взять деньги</label><div class="picker two-col" id="sWal"></div></div>'+
    '<div class="field"><label for="sAmt">Сумма</label>'+
      '<input id="sAmt" inputmode="decimal" value="'+escapeHtml(sdraft.amount)+'">'+
      '<div class="quick" id="sQuick"></div></div>'+
    '<div class="field"><label for="sNote">Метка</label><input id="sNote" value="'+escapeHtml(sdraft.note)+'" placeholder="инвестиции, неотложное"></div>'+
    '<div class="field"><label for="sDate">Дата</label><input id="sDate" type="date" value="'+sdraft.date+'"></div>';
  const wp=m.querySelector("#sWal");
  WALLETS.forEach(w=>{
    const b=document.createElement("button");
    b.className="pick"+(sdraft.wallet===w.id?" on":"");
    b.innerHTML=ico(walletIcon(w),"var(--ink-soft)",20)+w.name;
    b.onclick=()=>{ readSelf(); sdraft.wallet=w.id; drawSelf(); };
    wp.appendChild(b);
  });
  const q=m.querySelector("#sQuick");
  [["+ тыс",1e3],["+ млн",1e6]].forEach(([lbl,mult])=>{
    const b=document.createElement("button"); b.textContent=lbl;
    b.onclick=()=>{ const el=m.querySelector("#sAmt"); const n=cNum(el.value);
      if(isFinite(n)) el.value=String(Math.round(n*mult)); sdraft.auto=false; el.focus(); };
    q.appendChild(b);
  });
  const cl=document.createElement("button"); cl.textContent="← стереть";
  cl.onclick=()=>{ const el=m.querySelector("#sAmt"); el.value=""; sdraft.auto=false; el.focus(); };
  q.appendChild(cl);
  m.querySelector("#sAmt").addEventListener("input",()=>{ sdraft.auto=false; });
  const ok=document.createElement("button");
  ok.className="btn"; ok.textContent="Записать выплату"; ok.onclick=commitSelf; m.appendChild(ok);
  m.querySelector("#mClose").onclick=closeModal;
  $("#scrim").hidden=false;
}
function commitSelf(){
  readSelf();
  const p=parseAmount(sdraft.amount);
  if(!p||!p.amount){ toast("Впиши сумму"); return; }
  const w=walletById(sdraft.wallet), now=nowISO();
  const row={id:uuid(),date:sdraft.date,col:"self",amount:p.amount,cur:w.cur,wallet:w.id,
             note:sdraft.note.trim(),source:"user",created_at:now,updated_at:now};
  S.entries.push(row);
  enqueue({kind:"insert", id:row.id,
    row:{id:row.id,date:row.date,col:row.col,amount:row.amount,cur:row.cur,wallet:row.wallet,
         note:row.note,source:"user",created_at:now}});
  ui.month=row.date.slice(0,7);
  cacheSave(); closeModal(); render(); flushThen(); toast("Выплата записана");
}

  const ta=box.querySelector("#aiText"); ta.value=AI.draft;
  ta.oninput=()=>{ AI.draft=ta.value; };
  box.querySelector("#aiSendBtn").onclick=aiSend;
  return box;
}
function aiDrawList(){
  const box=document.getElementById("aiList"); if(!box) return;
  const sig=JSON.stringify([AI.msgs.map(m=>m.id),Object.values(AI.actions).map(a=>a.id+a.status),Object.keys(AI.busy),AI.thinking]);
  if(box.dataset.sig===sig) return;
  box.dataset.sig=sig;
  const grew=AI.msgs.length!==AI.n; AI.n=AI.msgs.length;
  box.innerHTML="";
  if(!AI.msgs.length && !AI.thinking){
    box.innerHTML='<div class="empty"><b>Пока пусто</b>Напиши сообщение. Например: «сколько у меня на картах?» или «покажи расходы за месяц».</div>';
    return;
  }
  let lastDay="";
  AI.msgs.forEach(m=>{
    const day=dmy(m.created_at);
    if(day!==lastDay){ lastDay=day; const s=document.createElement("div"); s.className="cb-day"; s.textContent=day; box.appendChild(s); }
    const d=document.createElement("div"); d.className="cb "+(m.role==="user"?"me":"bot");
    const a=m.action_id?AI.actions[m.action_id]:null;
    let h="";
    if(!a || m.content!==a.summary) h+='<div>'+escapeHtml(m.content).replace(/\n/g,"<br>")+'</div>';
    if(a){
      h+='<div class="cb-act'+(m.content===a.summary?' first':'')+'"><div class="cb-sum">'+escapeHtml(a.summary)+'</div><div class="cb-slot"></div></div>';
    }
    h+='<div class="cb-time">'+hhmm(m.created_at)+'</div>';
    d.innerHTML=h;
    if(a){
      const slot=d.querySelector(".cb-slot");
      if(a.status==="pending"){
        const busy=!!AI.busy[a.id];
        slot.className="abtns";
        slot.innerHTML='<button class="ok">Одобрить</button><button class="no">Отклонить</button>';
        const ok=slot.querySelector(".ok"), no=slot.querySelector(".no");
        ok.disabled=no.disabled=busy;
        ok.onclick=()=>aiDecide(a.id,true); no.onclick=()=>aiDecide(a.id,false);
      }else if(a.status==="approved"){ slot.className="cb-st ok"; slot.textContent="Одобрено и выполнено"; }
      else if(a.status==="rejected"){ slot.className="cb-st no"; slot.textContent="Отклонено"; }
      else{ slot.className="cb-st bad"; slot.textContent="Не выполнено: "+(a.error||"ошибка"); }
    }
    box.appendChild(d);
  });
  if(AI.thinking){
    const t=document.createElement("div"); t.className="cb bot";
    t.innerHTML='<div class="cb-st no">ИИ думает…</div>'; box.appendChild(t);
  }
  if(grew||AI.thinking) window.scrollTo(0,document.body.scrollHeight);
}
async function aiSend(){
  const ta=document.getElementById("aiText"), btn=document.getElementById("aiSendBtn");
  const text=(ta.value||"").trim(); if(!text) return;
  btn.disabled=true;
  try{
    await api("/rest/v1/ai_chat",{method:"POST",body:[{role:"user",content:text.slice(0,8000)}],headers:{Prefer:"return=minimal"}});
    ta.value=""; AI.draft="";
    await aiPull(); window.scrollTo(0,document.body.scrollHeight);
  }catch(e){ toast("Не отправилось: "+(e.message||"нет связи")); btn.disabled=false; return; }
  await aiAsk();
  const b2=document.getElementById("aiSendBtn"); if(b2) b2.disabled=false;
}
async function aiAsk(){
  AI.thinking=true; if(ui.tab==="ai") aiDrawList();
  try{
    await ensureToken();
    const r=await fetch(AI_BASE+"/chat",{method:"POST",
      headers:{Authorization:"Bearer "+session.access_token,"Content-Type":"application/json"},body:"{}"});
    if(!r.ok){ let m=""; try{ m=(await r.json()).error||""; }catch(e){}
      toast("ИИ не ответил: "+(m||("ошибка "+r.status))); }
  }catch(e){ toast("ИИ не ответил: нет связи"); }
  AI.thinking=false; await aiPull(); if(ui.tab==="ai") aiDrawList();
}
async function aiDecide(id,ok){
  if(AI.busy[id]) return;
  AI.busy[id]=true; aiDrawList();
  try{
    const r=await api("/rest/v1/rpc/ai_decide",{method:"POST",body:{p_id:id,p_approve:ok}});
    if(r && r.status==="failed") toast("Не выполнено: "+(r.error||"ошибка"));
    else toast(ok?"Выполнено":"Отклонено");
    await aiPull();
    if(ok) await sync();
  }catch(e){ toast(e.message||"Нет связи"); await aiPull(); }
  delete AI.busy[id]; if(ui.tab==="ai") aiDrawList();
}
async function aiCreateToken(){
  const inp=document.getElementById("aiTokName");
  const name=((inp&&inp.value)||"").trim()||"Помощник";
  try{
    AI.newToken=await api("/rest/v1/rpc/ai_create_token",{method:"POST",body:{p_name:name}});
    await aiPull(); aiDrawConn();
  }catch(e){ toast("Не создался: "+(e.message||"нет связи")); }
}
async function aiRevoke(id){
  if(!confirm("Отозвать токен? Ассистент с ним сразу потеряет доступ.")) return;
  try{ await api("/rest/v1/rpc/ai_revoke_token",{method:"POST",body:{p_id:id}}); toast("Отозван"); await aiPull(); }
  catch(e){ toast(e.message||"Нет связи"); }
}
function aiDrawConn(){
  const box=document.getElementById("aiConn"); if(!box) return;
  const sig=JSON.stringify([AI.tokens,AI.newToken]);
  if(box.dataset.sig===sig) return;

    'Токен — это пароль для другой программы: она сможет читать тетрадь и предлагать записи, но менять без твоей кнопки «Одобрить» не сможет. '+
    'Сейчас ничего подключать не нужно, внутренний ИИ работает сам. '+
    (active.length?"Выдано токенов: "+active.length+".":"Токенов пока нет.")+'</div><div id="aiToks"></div>';
  if(AI.newToken){
    const url=AI_BASE+"?token="+AI.newToken;
    h+='<div class="tokbox"><b>Токен показан один раз, скопируй сейчас.</b>'+
      '<div class="mono">'+escapeHtml(url)+'</div>'+
      '<div class="hint" style="margin-bottom:8px">n8n: HTTP Request, POST на <span class="mono">'+escapeHtml(AI_BASE)+'/call</span>, '+
      'заголовок Authorization: Bearer токен, тело {"tool":"get_overview","arguments":{}}. Список инструментов: GET <span class="mono">'+escapeHtml(AI_BASE)+'/tools</span>.</div>'+
      '<div class="abtns"><button id="aiCopyUrl">Ссылка для MCP</button><button id="aiCopyTok">Только токен</button></div></div>';
  }
  h+='<div class="field"><label for="aiTokName">Название нового токена</label><input id="aiTokName" placeholder="например, n8n"></div>'+
     '<button class="btn ghost" id="aiMake">Создать токен</button></details></div>';
  box.innerHTML=h;
  const det=box.querySelector("#aiDet"); det.ontoggle=()=>{ AI.connOpen=det.open; };
  box.querySelector("#aiTokName").value=keep;
  const list=box.querySelector("#aiToks");
  AI.tokens.forEach(t=>{
    const r=document.createElement("div"); r.className="tokrow";
    r.innerHTML='<div class="tn">'+escapeHtml(t.name)+'<div class="tm">создан '+dmy(t.created_at)+
      (t.revoked_at?" · отозван":(t.last_used_at?" · использован "+dmy(t.last_used_at)+" "+hhmm(t.last_used_at):" · ещё не использовался"))+'</div></div>';
    if(!t.revoked_at){ const b=document.createElement("button"); b.textContent="Отозвать"; b.onclick=()=>aiRevoke(t.id); r.appendChild(b); }
    list.appendChild(r);
  });
  box.querySelector("#aiMake").onclick=aiCreateToken;
  const cu=box.querySelector("#aiCopyUrl"); if(cu) cu.onclick=()=>aiCopy(AI_BASE+"?token="+AI.newToken);
  const ct=box.querySelector("#aiCopyTok"); if(ct) ct.onclick=()=>aiCopy(AI.newToken);

/* ---------- запись ---------- */
let draft=null;
function openAdd(){
  if(ui.tab==="goals"){ openGoal(null); return; }

          amount:"", wallet: ui.wallet!=="all"?ui.wallet:"cash_uzs", note:"" };

function openEntry(id){

function drawModal(){
  const m=$("#modal");

    '<div class="field"><label>Куда</label><div class="picker" id="pick"></div></div>'+

      '<input id="fAmt" inputmode="decimal" placeholder="650" value="'+escapeHtml(draft.amount)+'">'+
      '<div class="quick" id="quick"></div></div>'+
    '<div class="field"><label>Откуда деньги</label><div class="picker two-col" id="wpick"></div></div>'+
    '<div class="field"><label for="fNote">Метка</label>'+
      '<input id="fNote" placeholder="нал, бензин, продукты" value="'+escapeHtml(draft.note)+'"></div>'+
    '<div class="field"><label for="fDate">Дата</label>'+
      '<input id="fDate" type="date" value="'+draft.date+'"></div>';

  const pick=m.querySelector("#pick");
  COLS.forEach(c=>{
    const b=document.createElement("button");
    b.className="pick"+(draft.col===c.id?" on":"");
    if(draft.col===c.id) b.style.borderColor=c.color;

    b.onclick=()=>{ readDraft(); draft.col=c.id; drawModal(); };

  });
  const wp=m.querySelector("#wpick");
  WALLETS.forEach(w=>{
    const b=document.createElement("button");

    b.innerHTML=ico(walletIcon(w),"var(--ink-soft)",20)+w.name;
    b.onclick=()=>{ readDraft(); draft.wallet=w.id; drawModal(); };
    wp.appendChild(b);
  });
  const q=m.querySelector("#quick");
  [["+ тыс",1e3],["+ млн",1e6]].forEach(([lbl,mult])=>{
    const b=document.createElement("button"); b.textContent=lbl;
    b.onclick=()=>{ const el=m.querySelector("#fAmt");
      const n=parseFloat(String(el.value).replace(/\s/g,"").replace(",","."));
      if(isFinite(n)) el.value=String(Math.round(n*mult)); el.focus(); };
    q.appendChild(b);
  });
  const cl=document.createElement("button"); cl.textContent="← стереть";
  cl.onclick=()=>{ m.querySelector("#fAmt").value=""; m.querySelector("#fAmt").focus(); };
  q.appendChild(cl);

  const ok=document.createElement("button");
  ok.className="btn"; ok.textContent=draft.id?"Сохранить":"Записать";
  ok.onclick=()=>commit(false); m.appendChild(ok);

  if(!draft.id){
    const zero=document.createElement("button");
    zero.className="btn ghost"; zero.textContent="Сегодня прихода не было";
    zero.onclick=()=>commit(true); m.appendChild(zero);
  }
  if(draft.id){
    if(draft.updated_at){
      const info=document.createElement("div");
      info.style.cssText="font-size:11.5px;color:var(--ink-faint);margin-top:10px;text-align:center";
      info.textContent=(draft.source==="ai"?"внесено помощником · ":"изменено ")+
        dmy(draft.updated_at)+" "+hhmm(draft.updated_at);
      m.appendChild(info);
    }
    const del=document.createElement("button");
    del.className="btn danger"; del.textContent="Удалить запись";
    del.onclick=()=>{ S.entries=S.entries.filter(x=>x.id!==draft.id);
      enqueue({kind:"delete", id:draft.id}); cacheSave(); closeModal(); render(); flushThen(); };
    m.appendChild(del);
  }
  m.querySelector("#mClose").onclick=closeModal;
  m.querySelector("#fAmt").addEventListener("keydown",ev=>{ if(ev.key==="Enter") commit(false); });
  $("#scrim").hidden=false;
  setTimeout(()=>{ const a=m.querySelector("#fAmt"); if(a&&!draft.amount) a.focus(); },30);
}
function readDraft(){
  const m=$("#modal"); if(!m.querySelector("#fAmt")) return;
  draft.amount=m.querySelector("#fAmt").value;
  draft.note=m.querySelector("#fNote").value;
  draft.date=m.querySelector("#fDate").value||todayISO();
}
function commit(isZero){
  readDraft();
  let amount=0, note=draft.note.trim(), col=draft.col;
  if(isZero){ amount=0; col="in"; if(!note) note="прихода не было"; }
  else{
    const p=parseAmount(draft.amount);
    if(!p||!p.amount){ toast("Впиши сумму"); return; }
    amount=p.amount;
  }
  const w=walletById(draft.wallet);
  const now=nowISO();
  if(draft.id){
    const e=S.entries.find(x=>x.id===draft.id);
    Object.assign(e,{date:draft.date,col,amount,cur:w.cur,wallet:w.id,note,updated_at:now});
    enqueue({kind:"update", id:e.id,
      row:{date:e.date,col:e.col,amount:e.amount,cur:e.cur,wallet:e.wallet,note:e.note,updated_at:now}});
  }else{
    const row={id:uuid(),date:draft.date,col,amount,cur:w.cur,wallet:w.id,note,
               source:"user",created_at:now,updated_at:now};
    S.entries.push(row);
    enqueue({kind:"insert", id:row.id,
      row:{id:row.id,date:row.date,col:row.col,amount:row.amount,cur:row.cur,
           wallet:row.wallet,note:row.note,source:"user"}});
    ui.month=row.date.slice(0,7);
  }
  cacheSave(); closeModal(); render(); flushThen();
}
/* ---------- обмен между кошельками ---------- */
let cdraft=null;
function openConv(convId){
  if(convId){
    const o=S.entries.find(x=>x.conv_id===convId&&x.col==="cout");
    const i=S.entries.find(x=>x.conv_id===convId&&x.col==="cin");
    if(!o||!i){ toast("Половина обмена не найдена"); return; }
    cdraft={ id:convId, date:o.date, from:o.wallet, to:i.wallet, give:String(o.amount), get:String(i.amount),
             rate:o.rate?String(o.rate):"", note:o.note||"", source:o.source,
             updated_at:o.updated_at>i.updated_at?o.updated_at:i.updated_at };
  }else{
    cdraft={ id:null, date:todayISO(), from:"cash_usd", to:"cash_uzs", give:"", get:"",
             rate:String(Math.round(S.settings.rate)), note:"" };
  }
  drawConv();
}
const cNum = v => parseFloat(String(v||"").replace(/\s/g,"").replace(",","."));
function readConv(){
  const m=$("#modal"); if(!m.querySelector("#cGive")) return;
  cdraft.give=m.querySelector("#cGive").value;
  const r=m.querySelector("#cRate"), g=m.querySelector("#cGet");
  if(r) cdraft.rate=r.value; if(g) cdraft.get=g.value;
  cdraft.note=m.querySelector("#cNote").value;
  cdraft.date=m.querySelector("#cDate").value||todayISO();
}
function roundCur(v,cur){ return cur==="USD" ? Math.round(v*100)/100 : Math.round(v); }
/* пересчёт «получаю» / курса по тому, что менял пользователь */
function convRecalc(changed){
  const m=$("#modal"), wf=walletById(cdraft.from), wt=walletById(cdraft.to);
  if(wf.cur===wt.cur) return convSummary();
  const gv=m.querySelector("#cGive"), rt=m.querySelector("#cRate"), gt=m.querySelector("#cGet");
  const give=(parseAmount(gv.value)||{}).amount, rate=cNum(rt.value), get=(parseAmount(gt.value)||{}).amount;
  if(changed==="get"){
    if(give&&get){ const usd=wf.cur==="USD"?give:get, uzs=wf.cur==="USD"?get:give;
      rt.value=String(Math.round(uzs/usd*100)/100); }
  }else if(give&&rate){
    gt.value=String(roundCur(wf.cur==="USD"?give*rate:give/rate, wt.cur));
  }
  convSummary();
}
function convSummary(){
  const m=$("#modal"), el=m.querySelector("#cSum"); if(!el) return;
  const wf=walletById(cdraft.from), wt=walletById(cdraft.to);
  const give=(parseAmount(m.querySelector("#cGive").value)||{}).amount||0;
  const cross=wf.cur!==wt.cur;
  const gt=cross?((parseAmount(m.querySelector("#cGet").value)||{}).amount||0):give;
  let orig=0;
  if(cdraft.id){ const o=S.entries.find(x=>x.conv_id===cdraft.id&&x.col==="cout"); if(o&&o.wallet===wf.id) orig=o.amount; }
  const after=walletBalance(wf.id)+orig-give;
  el.innerHTML='<div><b>'+wf.name+'</b> −'+fmt(give,wf.cur)+' &nbsp;→&nbsp; <b>'+wt.name+'</b> +'+fmt(gt,wt.cur)+'</div>'+
    '<div style="font-size:12px;margin-top:5px;color:'+(after<0?"var(--red)":"var(--ink-soft)")+'">'+
    (after<0?"На «"+wf.name+"» не хватает "+fmt(-after,wf.cur):"После обмена на «"+wf.name+"»: "+fmt(after,wf.cur))+
    '</div><div style="font-size:12px;margin-top:3px;color:var(--ink-faint)">Это не приход и не расход: оборот месяца не меняется.</div>';
}
function drawConv(){
  const m=$("#modal"), wf=walletById(cdraft.from), wt=walletById(cdraft.to), cross=wf.cur!==wt.cur;
  m.innerHTML='<button class="mclose" id="mClose" aria-label="Закрыть">×</button>'+
    "<h3>"+(cdraft.id?"Обмен":"Обмен между кошельками")+"</h3>"+
    '<div class="field"><label>Откуда</label><div class="picker two-col" id="cFrom"></div></div>'+
    '<div class="field"><label>Куда</label><div class="picker two-col" id="cTo"></div></div>'+
    '<div class="field"><label for="cGive">Отдаю ('+(wf.cur==="USD"?"доллары":"сумы")+')</label>'+
      '<input id="cGive" inputmode="decimal" placeholder="'+(wf.cur==="USD"?"100":"1 000 000")+'" value="'+escapeHtml(cdraft.give)+'">'+
      '<div class="quick" id="cQuick"></div></div>'+
    (cross?
      '<div class="two"><div class="field"><label for="cRate">Курс, сум за $1</label>'+
        '<input id="cRate" inputmode="decimal" value="'+escapeHtml(cdraft.rate)+'"></div>'+
      '<div class="field"><label for="cGet">Получаю ('+(wt.cur==="USD"?"доллары":"сумы")+')</label>'+
        '<input id="cGet" inputmode="decimal" value="'+escapeHtml(cdraft.get)+'"></div></div>':"")+
    '<div class="conv-sum" id="cSum"></div>'+
    '<div class="field"><label for="cNote">Метка</label>'+
      '<input id="cNote" placeholder="обменник, банк" value="'+escapeHtml(cdraft.note)+'"></div>'+
    '<div class="field"><label for="cDate">Дата</label><input id="cDate" type="date" value="'+cdraft.date+'"></div>';

  [["#cFrom","from"],["#cTo","to"]].forEach(([sel,key])=>{
    const box=m.querySelector(sel);
    WALLETS.forEach(w=>{
      const b=document.createElement("button");
      b.className="pick"+(cdraft[key]===w.id?" on":"");
      b.innerHTML=ico(walletIcon(w),"var(--ink-soft)",20)+w.name;
      b.onclick=()=>{ readConv(); cdraft[key]=w.id;
        if(cdraft.from===cdraft.to){ cdraft[key==="from"?"to":"from"]=
          WALLETS.find(x=>x.id!==w.id && x.cur!==w.cur).id; }
        cdraft.get=""; drawConv(); };
      box.appendChild(b);
    });
  });
  const q=m.querySelector("#cQuick");
  [["+ тыс",1e3],["+ млн",1e6]].forEach(([lbl,mult])=>{
    const b=document.createElement("button"); b.textContent=lbl;
    b.onclick=()=>{ const el=m.querySelector("#cGive");
      const n=cNum(el.value); if(isFinite(n)) el.value=String(Math.round(n*mult)); convRecalc("give"); el.focus(); };
    q.appendChild(b);
  });
  const cl=document.createElement("button"); cl.textContent="← стереть";
  cl.onclick=()=>{ const el=m.querySelector("#cGive"); el.value=""; convRecalc("give"); el.focus(); };
  q.appendChild(cl);

  m.querySelector("#cGive").addEventListener("input",()=>convRecalc("give"));
  const r=m.querySelector("#cRate"), g=m.querySelector("#cGet");
  if(r) r.addEventListener("input",()=>convRecalc("rate"));
  if(g) g.addEventListener("input",()=>convRecalc("get"));

  const ok=document.createElement("button");
  ok.className="btn"; ok.textContent=cdraft.id?"Сохранить":"Записать обмен";
  ok.onclick=commitConv; m.appendChild(ok);
  if(cdraft.id){
    if(cdraft.updated_at){
      const info=document.createElement("div");
      info.style.cssText="font-size:11.5px;color:var(--ink-faint);margin-top:10px;text-align:center";
      info.textContent=(cdraft.source==="ai"?"внесено помощником · ":"изменено ")+dmy(cdraft.updated_at)+" "+hhmm(cdraft.updated_at);
      m.appendChild(info);
    }
    const del=document.createElement("button");
    del.className="btn danger"; del.textContent="Удалить обмен";
    del.onclick=()=>{
      const gone=S.entries.filter(x=>x.conv_id===cdraft.id);
      S.entries=S.entries.filter(x=>x.conv_id!==cdraft.id);
      gone.forEach(x=>enqueue({kind:"delete", id:x.id}));
      cacheSave(); closeModal(); render(); flushThen(); };
    m.appendChild(del);
  }
  m.querySelector("#mClose").onclick=closeModal;
  if(cross && !cdraft.get) convRecalc("give"); else convSummary();
  $("#scrim").hidden=false;
  setTimeout(()=>{ const a=m.querySelector("#cGive"); if(a&&!cdraft.give) a.focus(); },30);
}
function commitConv(){
  readConv();
  const wf=walletById(cdraft.from), wt=walletById(cdraft.to);
  if(wf.id===wt.id){ toast("Выбери разные кошельки"); return; }
  const g=parseAmount(cdraft.give);
  if(!g||!g.amount){ toast("Впиши, сколько отдаёшь"); return; }
  const give=g.amount, cross=wf.cur!==wt.cur;
  let get=give, rate=null;
  if(cross){
    const gt=parseAmount(cdraft.get);
    if(!gt||!gt.amount){ toast("Впиши курс или сколько получаешь"); return; }
    get=gt.amount;
    const usd=wf.cur==="USD"?give:get, uzs=wf.cur==="USD"?get:give;
    rate=Math.round(uzs/usd*100)/100;
  }
  const note=cdraft.note.trim(), now=nowISO();
  if(cdraft.id){
    const o=S.entries.find(x=>x.conv_id===cdraft.id&&x.col==="cout");
    const i=S.entries.find(x=>x.conv_id===cdraft.id&&x.col==="cin");
    Object.assign(o,{date:cdraft.date,amount:give,cur:wf.cur,wallet:wf.id,note,rate,updated_at:now});
    Object.assign(i,{date:cdraft.date,amount:get,cur:wt.cur,wallet:wt.id,note,rate,updated_at:now});
    [o,i].forEach(x=>enqueue({kind:"update", id:x.id,
      row:{date:x.date,amount:x.amount,cur:x.cur,wallet:x.wallet,note:x.note,rate:x.rate,updated_at:now}}));
  }else{
    const cid=uuid(), tIn=new Date(Date.parse(now)+1).toISOString();
    const o={id:uuid(),date:cdraft.date,col:"cout",amount:give,cur:wf.cur,wallet:wf.id,note,source:"user",
             conv_id:cid,rate,created_at:now,updated_at:now};
    const i={id:uuid(),date:cdraft.date,col:"cin",amount:get,cur:wt.cur,wallet:wt.id,note,source:"user",
             conv_id:cid,rate,created_at:tIn,updated_at:tIn};
    S.entries.push(o,i);
    [o,i].forEach(x=>enqueue({kind:"insert", id:x.id,
      row:{id:x.id,date:x.date,col:x.col,amount:x.amount,cur:x.cur,wallet:x.wallet,note:x.note,
           source:"user",conv_id:x.conv_id,rate:x.rate,created_at:x.created_at}}));
    ui.month=cdraft.date.slice(0,7);
  }
  cacheSave(); closeModal(); render(); flushThen();
}
function closeModal(){ $("#scrim").hidden=true; draft=null; gdraft=null; cdraft=null; sdraft=null; }
async function flushThen(){
  try{ await flushQueue(); ui.lastError=null; }catch(e){ ui.lastError=e.message; }
  renderSync();
  if(ui.tab==="book"||ui.tab==="goals") render();
}

/* ---------- мелочи ---------- */
function exportJSON(){
  const blob=new Blob([JSON.stringify({v:3,settings:S.settings,entries:S.entries,goals:S.goals},null,2)],
    {type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob); a.download="ezhednevnik-"+todayISO()+".json"; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  toast("Файл выгружен");
}
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
let toastT=null;
function toast(msg){
  const t=$("#toast"); t.textContent=msg; t.hidden=false;
  clearTimeout(toastT); toastT=setTimeout(()=>{ t.hidden=true; },2200);
}

/* ---------- вход ---------- */
let signMode="in";
function viewSignIn(err){
  document.body.classList.add("auth");
  $("#hdr").hidden=true; $("#tabbar").hidden=true;
  const v=$("#view"); v.className="signin";
  v.innerHTML="<h1>Ежедневник</h1>"+
    '<p class="lead">Записи хранятся в твоей базе. Войди, чтобы они были и на телефоне, и на компьютере.</p>'+
    '<div class="block">'+(err?'<div class="err">'+escapeHtml(err)+"</div>":"")+
      '<div class="field"><label for="aEmail">Почта</label>'+
        '<input id="aEmail" type="email" autocomplete="username" inputmode="email"></div>'+
      '<div class="field"><label for="aPass">Пароль</label>'+
        '<input id="aPass" type="password" autocomplete="current-password"></div></div>';
  const block=v.querySelector(".block");
  const go=document.createElement("button");
  go.className="btn"; go.textContent=signMode==="in"?"Войти":"Создать аккаунт";
  go.onclick=async()=>{
    const email=document.getElementById("aEmail").value.trim();
    const pass=document.getElementById("aPass").value;
    if(!email||!pass){ viewSignIn("Впиши почту и пароль"); return; }
    go.disabled=true; go.textContent="Секунду…";
    try{
      if(signMode==="in") await signIn(email,pass);
      else{
        const ok=await signUp(email,pass);
        if(!ok){ signMode="in"; viewSignIn("Аккаунт создан. Подтверди письмо и войди."); return; }
      }
      await boot();
    }catch(e){
      viewSignIn(e.message==="Invalid login credentials"?"Почта или пароль не подходят":e.message);
    }
  };
  block.appendChild(go);
  const sw=document.createElement("button");
  sw.className="swap"; sw.textContent=signMode==="in"?"Аккаунта ещё нет":"У меня уже есть аккаунт";
  sw.onclick=()=>{ signMode=signMode==="in"?"up":"in"; viewSignIn(); };
  block.appendChild(sw);
  document.getElementById("aPass").addEventListener("keydown",ev=>{ if(ev.key==="Enter") go.click(); });
}

/* ---------- запуск ---------- */
document.querySelectorAll(".tab").forEach(b=>{
  b.onclick=()=>{ ui.tab=b.dataset.tab; render(); window.scrollTo(0,0); };
});
$("#addBtn").onclick=openAdd;
$("#prevM").onclick=()=>{ ui.month=shiftMonth(ui.month,-1); render(); };
$("#nextM").onclick=()=>{ ui.month=shiftMonth(ui.month,+1); render(); };
$("#scrim").onclick=ev=>{ if(ev.target===$("#scrim")) closeModal(); };
document.addEventListener("keydown",ev=>{ if(ev.key==="Escape"&&!$("#scrim").hidden) closeModal(); });
window.addEventListener("online",()=>{ if(session) sync(); });
document.addEventListener("visibilitychange",()=>{ if(!document.hidden&&session) checkReminders(); });
setInterval(()=>{ if(session) checkReminders(); }, 5*60*1000);

async function boot(){
  try{ session=JSON.parse(LS.get(K_SESSION)||"null"); }catch(e){ session=null; }
  if(!session){ viewSignIn(); return; }
  document.body.classList.remove("auth");
  $("#view").className="wrap";
  $("#hdr").hidden=false; $("#tabbar").hidden=false;
  queueLoad(); cacheLoad(); render();
  await sync();
  fetchCbuRate();
}
boot();
let aiTick=0;
setInterval(()=>{
  if(!session || document.hidden) return;
  aiTick++; if(ui.tab==="ai" || aiTick%6===0) aiPull();
},10000);

if("serviceWorker" in navigator && location.protocol.startsWith("http")){
  window.addEventListener("load",()=>{
    navigator.serviceWorker.register("./sw.js").then(reg=>{
      if("periodicSync" in reg){
        reg.periodicSync.register("ezh-daily",{minInterval:12*60*60*1000}).catch(()=>{});
      }
    }).catch(()=>{});
  });
}
