/* пересчёт «получаю» / курса по тому, что менял пользователь */
function convRecalc(changed){
  const m=$("#modal"), wf=walletById(cdraft.from), wt=walletById(cdraft.to);
  if(wf.cur===wt.cur) return convSummary();
  const gv=m.querySelector("#cGive"), rt=m.querySelector("#cRate"), gt=m.querySelector("#cGet");
  const give=(parseAmount(gv.value)||{}).amount, rate=cNum(rt.value), get=(parseAmount(gt.value)||{}).amount;
  if(changed==="get"){
    if(give&&get){ const usd=wf.cur==="USD"?give:get, uzs=wf.cur==="USD"?get:give;
      rt.value=String(Math.round(uzs/usd*100)/100); }
  }else if(give&&rate){
    gt.value=String(roundCur(wf.cur==="USD"?give*rate:give/rate, wt.cur));
  }
  convSummary();
}
function convSummary(){
  const m=$("#modal"), el=m.querySelector("#cSum"); if(!el) return;
  const wf=walletById(cdraft.from), wt=walletById(cdraft.to);
  const give=(parseAmount(m.querySelector("#cGive").value)||{}).amount||0;
  const cross=wf.cur!==wt.cur;
  const gt=cross?((parseAmount(m.querySelector("#cGet").value)||{}).amount||0):give;
  let orig=0;
  if(cdraft.id){ const o=S.entries.find(x=>x.conv_id===cdraft.id&&x.col==="cout"); if(o&&o.wallet===wf.id) orig=o.amount; }
  const after=walletBalance(wf.id)+orig-give;
  const fx=cross?fxDiff(wf.cur,give,gt,cdraft.book):null;
  el.innerHTML='<div><b>'+wf.name+'</b> −'+fmt(give,wf.cur)+' &nbsp;→&nbsp; <b>'+wt.name+'</b> +'+fmt(gt,wt.cur)+'</div>'+
    '<div style="font-size:12px;margin-top:5px;color:'+(after<0?"var(--red)":"var(--ink-soft)")+'">'+
    (after<0?"На «"+wf.name+"» не хватает "+fmt(-after,wf.cur):"После обмена на «"+wf.name+"»: "+fmt(after,wf.cur))+
    '</div>'+(fx!==null?'<div style="font-size:13px;margin-top:6px">Курсовая разница: <b class="'+fxClass(fx)+'">'+fxText(fx)+'</b>'+
      '<span style="color:var(--ink-faint);font-size:12px"> · учётный курс '+Math.round(cdraft.book).toLocaleString("ru-RU").replace(/\u00A0/g," ")+'</span></div>':"")+
    '<div style="font-size:12px;margin-top:3px;color:var(--ink-faint)">Это не приход и не расход: оборот месяца не меняется. Разница только показана, с остатков она не списывается.</div>';
}
function drawConv(){
  const m=$("#modal"), wf=walletById(cdraft.from), wt=walletById(cdraft.to), cross=wf.cur!==wt.cur;
  m.innerHTML='<button class="mclose" id="mClose" aria-label="Закрыть">×</button>'+
    "<h3>"+(cdraft.id?"Обмен":"Обмен между кошельками")+"</h3>"+
    '<div class="field"><label>Откуда</label><div class="picker two-col" id="cFrom"></div></div>'+
    '<div class="field"><label>Куда</label><div class="picker two-col" id="cTo"></div></div>'+
    '<div class="field"><label for="cGive">Отдаю ('+(wf.cur==="USD"?"доллары":"сумы")+')</label>'+
      '<input id="cGive" inputmode="decimal" placeholder="'+(wf.cur==="USD"?"100":"1 000 000")+'" value="'+escapeHtml(cdraft.give)+'">'+
      '<div class="quick" id="cQuick"></div></div>'+
    (cross?
      '<div class="two"><div class="field"><label for="cRate">Курс, сум за $1</label>'+
        '<input id="cRate" inputmode="decimal" value="'+escapeHtml(cdraft.rate)+'"></div>'+
      '<div class="field"><label for="cGet">Получаю ('+(wt.cur==="USD"?"доллары":"сумы")+')</label>'+
        '<input id="cGet" inputmode="decimal" value="'+escapeHtml(cdraft.get)+'"></div></div>':"")+
    '<div class="conv-sum" id="cSum"></div>'+
    '<div class="field"><label for="cNote">Метка</label>'+
      '<input id="cNote" placeholder="обменник, банк" value="'+escapeHtml(cdraft.note)+'"></div>'+
    '<div class="field"><label for="cDate">Дата</label><input id="cDate" type="date" value="'+cdraft.date+'"></div>';

  [["#cFrom","from"],["#cTo","to"]].forEach(([sel,key])=>{
    const box=m.querySelector(sel);
    WALLETS.forEach(w=>{
      const b=document.createElement("button");
      b.className="pick"+(cdraft[key]===w.id?" on":"");
      b.innerHTML=ico(walletIcon(w),"var(--ink-soft)",20)+w.name;
      b.onclick=()=>{ readConv(); cdraft[key]=w.id;
        if(cdraft.from===cdraft.to){ cdraft[key==="from"?"to":"from"]=
          WALLETS.find(x=>x.id!==w.id && x.cur!==w.cur).id; }
        cdraft.get=""; drawConv(); };
      box.appendChild(b);
    });
  });
  const q=m.querySelector("#cQuick");
  [["+ тыс",1e3],["+ млн",1e6]].forEach(([lbl,mult])=>{
    const b=document.createElement("button"); b.textContent=lbl;
    b.onclick=()=>{ const el=m.querySelector("#cGive");
      const n=cNum(el.value); if(isFinite(n)) el.value=String(Math.round(n*mult)); convRecalc("give"); el.focus(); };
    q.appendChild(b);
  });
  const cl=document.createElement("button"); cl.textContent="← стереть";
  cl.onclick=()=>{ const el=m.querySelector("#cGive"); el.value=""; convRecalc("give"); el.focus(); };
  q.appendChild(cl);

  m.querySelector("#cGive").addEventListener("input",()=>convRecalc("give"));
  const r=m.querySelector("#cRate"), g=m.querySelector("#cGet");
  if(r) r.addEventListener("input",()=>convRecalc("rate"));
  if(g) g.addEventListener("input",()=>convRecalc("get"));

  const ok=document.createElement("button");
  ok.className="btn"; ok.textContent=cdraft.id?"Сохранить":"Записать обмен";
  ok.onclick=commitConv; m.appendChild(ok);
  if(cdraft.id){
    if(cdraft.updated_at){
      const info=document.createElement("div");
      info.style.cssText="font-size:11.5px;color:var(--ink-faint);margin-top:10px;text-align:center";
      info.textContent=(cdraft.source==="ai"?"внесено помощником · ":"изменено ")+dmy(cdraft.updated_at)+" "+hhmm(cdraft.updated_at);
      m.appendChild(info);
    }
    const del=document.createElement("button");
    del.className="btn danger"; del.textContent="Удалить обмен";
    del.onclick=()=>{
      const gone=S.entries.filter(x=>x.conv_id===cdraft.id);
      S.entries=S.entries.filter(x=>x.conv_id!==cdraft.id);
      gone.forEach(x=>enqueue({kind:"delete", id:x.id}));
      cacheSave(); closeModal(); render(); flushThen(); };
    m.appendChild(del);
  }
  m.querySelector("#mClose").onclick=dismissModal;
  if(cross && !cdraft.get) convRecalc("give"); else convSummary();
  $("#scrim").hidden=false;
  setTimeout(()=>{ const a=m.querySelector("#cGive"); if(a&&cdraft&&!cdraft.give) a.focus(); },30);
}
function commitConv(){
  readConv();
  const wf=walletById(cdraft.from), wt=walletById(cdraft.to);
  if(wf.id===wt.id){ toast("Выбери разные кошельки"); return; }
  const g=parseAmount(cdraft.give);
  if(!g||!g.amount){ toast("Впиши, сколько отдаёшь"); return; }
  const give=g.amount, cross=wf.cur!==wt.cur;
  let get=give, rate=null, book=null;
  if(cross){
    const gt=parseAmount(cdraft.get);
    if(!gt||!gt.amount){ toast("Впиши курс или сколько получаешь"); return; }
    get=gt.amount;
    const usd=wf.cur==="USD"?give:get, uzs=wf.cur==="USD"?get:give;
    rate=Math.round(uzs/usd*100)/100;
    book=cdraft.book>0?cdraft.book:null;
  }
  const note=cdraft.note.trim(), now=nowISO();
  if(cdraft.id){
    const o=S.entries.find(x=>x.conv_id===cdraft.id&&x.col==="cout");
    const i=S.entries.find(x=>x.conv_id===cdraft.id&&x.col==="cin");
    Object.assign(o,{date:cdraft.date,amount:give,cur:wf.cur,wallet:wf.id,note,rate,book_rate:book,updated_at:now});
    Object.assign(i,{date:cdraft.date,amount:get,cur:wt.cur,wallet:wt.id,note,rate,book_rate:book,updated_at:now});
    [o,i].forEach(x=>enqueue({kind:"update", id:x.id,
      row:{date:x.date,amount:x.amount,cur:x.cur,wallet:x.wallet,note:x.note,rate:x.rate,book_rate:x.book_rate,updated_at:now}}));
  }else{
    const cid=uuid(), tIn=new Date(Date.parse(now)+1).toISOString();
    const o={id:uuid(),date:cdraft.date,col:"cout",amount:give,cur:wf.cur,wallet:wf.id,note,source:"user",
             conv_id:cid,rate,book_rate:book,created_at:now,updated_at:now};
    const i={id:uuid(),date:cdraft.date,col:"cin",amount:get,cur:wt.cur,wallet:wt.id,note,source:"user",
             conv_id:cid,rate,book_rate:book,created_at:tIn,updated_at:tIn};
    S.entries.push(o,i);
    [o,i].forEach(x=>enqueue({kind:"insert", id:x.id,
      row:{id:x.id,date:x.date,col:x.col,amount:x.amount,cur:x.cur,wallet:x.wallet,note:x.note,
           source:"user",conv_id:x.conv_id,rate:x.rate,book_rate:x.book_rate,created_at:x.created_at}}));
    ui.month=cdraft.date.slice(0,7);
  }
  cacheSave(); closeModal(); render(); flushThen();
}

/* ---------- черновики: недописанное не пропадает ---------- */
const K_DRAFTS="ezh:drafts";
let DR=(()=>{ try{ const o=JSON.parse(LS.get(K_DRAFTS)||"{}"); return (o&&typeof o==="object")?o:{}; }catch(e){ return {}; } })();
const drSave=()=>LS.set(K_DRAFTS, JSON.stringify(DR));
const DR_NAME={entry:"Запись",conv:"Обмен",self:"Выплата себе",goal:"Цель",step:"Этап",debt:"Долг"};
let resuming=false, drTimer=null;
function drKind(){
  if($("#scrim").hidden) return null;
  const m=$("#modal");
  if(draft) return "entry";
  if(cdraft) return "conv";
  if(sdraft) return "self";
  if(gdraft) return "goal";
  if(stdraft && m.querySelector("#sT")) return "step";
  if(dbdraft) return "debt";
  return null;
}
const drObj=k=>({entry:draft,conv:cdraft,self:sdraft,goal:gdraft,step:stdraft,debt:dbdraft})[k];
const drVal=id=>{ const el=$("#modal").querySelector("#"+id); return el?String(el.value||"").trim():""; };
function drDirty(k){
  if(k==="entry") return !!(drVal("fAmt")||drVal("fNote"));
  if(k==="conv")  return !!(drVal("cGive")||drVal("cNote"));
  if(k==="self")  return !!((sdraft.auto===false&&drVal("sAmt"))||(drVal("sNote")&&drVal("sNote")!=="себе"));
  if(k==="goal")  return !!drVal("gT");
  if(k==="step")  return !!(drVal("sT")||drVal("sA"));
  if(k==="debt")  return !!(drVal("dP")||drVal("dA")||drVal("dN"));
  return false;
}
function drLabel(k,f){
  if(k==="entry"){ const c=COLS.find(x=>x.id===draft.col); return (c?c.name:"")+(f.fAmt?" "+f.fAmt:"")+(f.fNote?" · "+f.fNote:""); }
  if(k==="conv") return (f.cGive?f.cGive+" ":"")+(f.cNote||"");
  if(k==="self") return f.sAmt||f.sNote||"";
  if(k==="goal") return f.gT||"";
  if(k==="step") return f.sT||f.sA||"";
  if(k==="debt") return (f.dP||"")+(f.dA?" "+f.dA:"");
  return "";
}
function drStore(){
  const k=drKind(); if(!k) return;
  const o=drObj(k);
  if(o.id) return;                       // правку существующей записи не храним, только новые
  if(!drDirty(k)){ if(DR[k]){ delete DR[k]; drSave(); } return; }
  if(k==="entry") readDraft(); if(k==="conv") readConv(); if(k==="self") readSelf();
  const f={}; $("#modal").querySelectorAll("input[id],select[id]").forEach(el=>{ f[el.id]=el.value; });
  DR[k]={ t:Date.now(), obj:JSON.parse(JSON.stringify(drObj(k))), fields:f, label:drLabel(k,f) };
  drSave();
}
function drSoon(){ clearTimeout(drTimer); drTimer=setTimeout(()=>{ drStore(); const b=$("#addBtn"); if(b) b.classList.toggle("hasdraft",Object.keys(DR).length>0); },250); }
function drApply(f){ Object.keys(f||{}).forEach(id=>{ const el=$("#modal").querySelector("#"+id); if(el) el.value=f[id]; }); }
function drResume(k){
  const s=DR[k]; if(!s) return false;
  if(k==="step" && !S.goals.some(g=>g.id===s.obj.goal) && !S.debts.some(g=>g.id===s.obj.goal)){ delete DR[k]; drSave(); return false; }
  resuming=true;
  try{
    if(k==="entry"){ draft=s.obj; drawModal(); }
    else if(k==="conv"){ cdraft=s.obj; drawConv(); }
    else if(k==="self"){ sdraft=s.obj; drawSelf(); }
    else if(k==="goal"){ openGoal(null); drApply(s.fields); }
    else if(k==="step"){ openStep(null,s.obj.goal); drApply(s.fields); }
    else if(k==="debt"){ openDebt(null); drApply(s.fields);
      const bs=$("#modal").querySelectorAll("#dK .pick"); if(bs.length) bs[s.obj.kind==="owed"?1:0].click(); }
  }finally{ resuming=false; }
  const h=$("#modal").querySelector("h3");
  if(h){
    h.insertAdjacentHTML("afterend",'<div class="draftnote"><span>✎ Продолжаешь с места, где остановился</span><button id="drFresh">Начать заново</button></div>');
    $("#drFresh").onclick=()=>{ const gid=s.obj.goal; delete DR[k]; drSave(); closeModalRaw();
      ({entry:openNewEntry,conv:()=>openConv(null),self:openSelf,goal:()=>openGoal(null),step:()=>openStep(null,gid),debt:()=>openDebt(null)})[k](); render(); };
  }
  return true;
}
function renderDraftBar(){
  const bar=$("#draftBar"); if(!bar) return;
  const keys=Object.keys(DR);
  $("#addBtn").classList.toggle("hasdraft",keys.length>0);
  bar.innerHTML=""; bar.hidden=!keys.length;
  keys.forEach(k=>{
    const b=document.createElement("button"); b.className="dchip";
    b.innerHTML='<span class="dlab">Черновик</span><span class="dtx"><b>'+DR_NAME[k]+'</b>'+(DR[k].label?" · "+escapeHtml(DR[k].label):"")+'</span><i class="dx" title="Удалить черновик">×</i>';
    b.onclick=ev=>{
      if(ev.target.classList.contains("dx")){ delete DR[k]; drSave(); renderDraftBar(); return; }
      drResume(k);
    };
    bar.appendChild(b);
  });
}
$("#modal").addEventListener("input",drSoon);
$("#modal").addEventListener("change",drSoon);
$("#modal").addEventListener("click",drSoon);
document.addEventListener("visibilitychange",()=>{ if(document.hidden){ clearTimeout(drTimer); drStore(); } });
window.addEventListener("pagehide",()=>{ clearTimeout(drTimer); drStore(); });
function closeModalRaw(){ $("#scrim").hidden=true; draft=null; gdraft=null; cdraft=null; sdraft=null; stdraft=null; dbdraft=null; }
/* после успешного сохранения или удаления: черновик этого вида больше не нужен */
function closeModal(){
  const k=drKind();
  if(k){ const o=drObj(k); if(o&&!o.id&&DR[k]){ delete DR[k]; drSave(); } }
  clearTimeout(drTimer); closeModalRaw();
}
/* закрыли крестиком, тапом мимо или Escape: недописанное сохраняется как черновик */
function dismissModal(){ clearTimeout(drTimer); drStore(); closeModalRaw(); render(); }
async function flushThen(){
  try{ await flushQueue(); ui.lastError=null; }catch(e){ ui.lastError=e.message; }
  renderSync();
  if(ui.tab==="book"||ui.tab==="goals") render();
}

let signMode="in";
function viewSignIn(err){
  document.body.classList.add("auth");

  v.innerHTML="<h1>Ежедневник</h1>"+

      '<div class="field"><label for="aEmail">Почта</label>'+
        '<input id="aEmail" type="email" autocomplete="username" inputmode="email"></div>'+
      '<div class="field"><label for="aPass">Пароль</label>'+
        '<input id="aPass" type="password" autocomplete="current-password"></div></div>';
  const block=v.querySelector(".block");
  const go=document.createElement("button");
  go.className="btn"; go.textContent=signMode==="in"?"Войти":"Создать аккаунт";
  go.onclick=async()=>{
    const email=document.getElementById("aEmail").value.trim();

    if(!email||!pass){ viewSignIn("Впиши почту и пароль"); return; }
    go.disabled=true; go.textContent="Секунду…";
    try{
      if(signMode==="in") await signIn(email,pass);
      else{
        const ok=await signUp(email,pass);
        if(!ok){ signMode="in"; viewSignIn("Аккаунт создан. Подтверди письмо и войди."); return; }
      }
      await boot();
    }catch(e){
      viewSignIn(e.message==="Invalid login credentials"?"Почта или пароль не подходят":e.message);
    }
  };
  block.appendChild(go);
  const sw=document.createElement("button");
  sw.className="swap"; sw.textContent=signMode==="in"?"Аккаунта ещё нет":"У меня уже есть аккаунт";
  sw.onclick=()=>{ signMode=signMode==="in"?"up":"in"; viewSignIn(); };
  block.appendChild(sw);
  document.getElementById("aPass").addEventListener("keydown",ev=>{ if(ev.key==="Enter") go.click(); });
}


/* ---------- оформление: тема и стекло ---------- */
const K_THEME="ezh:theme", K_BGIMG="ezh:bgimg";
const BGS={
  aurora:"radial-gradient(900px 600px at 12% 18%,#ff8a5b99,transparent 60%),radial-gradient(800px 600px at 88% 30%,#3dd6c6aa,transparent 60%),radial-gradient(900px 700px at 50% 100%,#7c5cff99,transparent 60%),linear-gradient(160deg,#16225a,#0b3b45)",
  dusk:"radial-gradient(900px 600px at 20% 10%,#ffb36b99,transparent 60%),radial-gradient(900px 700px at 90% 60%,#e8527a88,transparent 60%),linear-gradient(160deg,#2a1b4d,#5a2a52)",
  sea:"radial-gradient(900px 600px at 80% 10%,#d6f5ee99,transparent 60%),radial-gradient(900px 700px at 10% 90%,#2bb0c999,transparent 60%),linear-gradient(160deg,#0b3a53,#1b7f96)",
  graphite:"radial-gradient(900px 600px at 20% 10%,#5b6f8a88,transparent 60%),radial-gradient(900px 700px at 90% 90%,#3a4a5e99,transparent 60%),linear-gradient(160deg,#0f141a,#25303c)"
};
const BG_NAMES={aurora:"Аврора",dusk:"Закат",sea:"Море",graphite:"Графит",custom:"Своя"};
let TH=(()=>{ let o={}; try{ o=JSON.parse(LS.get(K_THEME)||"{}")||{}; }catch(e){}
  return Object.assign({mode:"auto",glass:false,bg:"aurora",alpha:62,blur:16},o); })();
const thSave=()=>LS.set(K_THEME,JSON.stringify(TH));
const thDark=()=>TH.mode==="dark"||(TH.mode==="auto"&&window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches);
function applyTheme(){
  const h=document.documentElement, dark=thDark();
  h.classList.toggle("dark",dark); h.classList.toggle("glass",!!TH.glass);
  h.style.setProperty("--ga",TH.alpha+"%"); h.style.setProperty("--gb",TH.blur+"px");
  let bg=BGS[TH.bg]||BGS.aurora;
  if(TH.bg==="custom"){ const d=LS.get(K_BGIMG); if(d) bg='url("'+d+'")'; }
  h.style.setProperty("--bgimg",bg);
  const m=document.querySelector('meta[name="theme-color"]'); if(m) m.setAttribute("content",dark?"#11161C":"#FBF9F3");
}
if(window.matchMedia) try{ matchMedia("(prefers-color-scheme: dark)").addEventListener("change",()=>{ if(TH.mode==="auto") applyTheme(); }); }catch(e){}
function pickBtns(list,cur,fn,cls){
  const d=document.createElement("div"); d.className="picker"+(cls?" "+cls:"");
  list.forEach(([k,t])=>{ const b=document.createElement("button"); b.className="pick"+(String(cur)===String(k)?" on":""); b.textContent=t;
    b.onclick=()=>fn(k); d.appendChild(b); });
  return d;
}
function themeBlock(){
  const b=document.createElement("div"); b.className="block"; b.innerHTML="<h2>Оформление</h2>";
  const f1=document.createElement("div"); f1.className="field"; f1.innerHTML="<label>Тема</label>";
  f1.appendChild(pickBtns([["auto","Как на устройстве"],["light","Светлая"],["dark","Тёмная"]],TH.mode,k=>{ TH.mode=k; thSave(); applyTheme(); render(); }));
  b.appendChild(f1);
  const f2=document.createElement("div"); f2.className="field"; f2.innerHTML="<label>Фон</label>";
  f2.appendChild(pickBtns([["0","Обычный"],["1","Стекло"]],TH.glass?"1":"0",k=>{ TH.glass=k==="1"; thSave(); applyTheme(); render(); },"two-col"));
  b.appendChild(f2);
  if(TH.glass){
    const sw=document.createElement("div"); sw.className="field"; sw.innerHTML="<label>Картинка за стеклом</label>";
    const g=document.createElement("div"); g.className="swatches";
    Object.keys(BG_NAMES).forEach(k=>{
      const x=document.createElement("button"); x.className=TH.bg===k?"on":""; x.textContent=BG_NAMES[k];
      if(k==="custom"){ const d=LS.get(K_BGIMG); x.style.background=d?'url("'+d+'") center/cover':"var(--paper-2)"; if(!d){ x.style.color="var(--ink-soft)"; x.style.textShadow="none"; } }
      else x.style.background=BGS[k];
      x.onclick=()=>{ if(k==="custom"&&!LS.get(K_BGIMG)){ file.click(); return; } TH.bg=k; thSave(); applyTheme(); render(); };
      g.appendChild(x);
    });
    sw.appendChild(g);
    const file=document.createElement("input"); file.type="file"; file.accept="image/*"; file.hidden=true;
    file.onchange=()=>{
      const f=file.files&&file.files[0]; if(!f) return;
      const img=new Image(), url=URL.createObjectURL(f);
      img.onload=()=>{
        const k=Math.min(1,1600/Math.max(img.width,img.height)), c=document.createElement("canvas");
        c.width=Math.round(img.width*k); c.height=Math.round(img.height*k); c.getContext("2d").drawImage(img,0,0,c.width,c.height);
        const data=c.toDataURL("image/jpeg",0.8); URL.revokeObjectURL(url);
        LS.set(K_BGIMG,data);
        if(LS.get(K_BGIMG)!==data){ toast("Картинка не поместилась в память браузера"); return; }
        TH.bg="custom"; thSave(); applyTheme(); render();
      };
      img.onerror=()=>toast("Не удалось открыть картинку"); img.src=url;
    };
    sw.appendChild(file);
    const up=document.createElement("button"); up.className="btn ghost"; up.style.marginTop="8px"; up.textContent="Выбрать свою картинку";
    up.onclick=()=>file.click(); sw.appendChild(up);
    b.appendChild(sw);
    const slider=(label,min,max,val,unit,onv)=>{
      const f=document.createElement("div"); f.className="field";
      const lab=document.createElement("label"); lab.textContent=label+": "+val+unit; f.appendChild(lab);
      const r=document.createElement("input"); r.type="range"; r.min=min; r.max=max; r.value=val;
      r.oninput=()=>{ lab.textContent=label+": "+r.value+unit; onv(+r.value); applyTheme(); };
      r.onchange=thSave; f.appendChild(r); return f;
    };
    b.appendChild(slider("Прозрачность панелей",5,70,100-TH.alpha,"%",v=>{ TH.alpha=100-v; }));
    b.appendChild(slider("Размытие",0,30,TH.blur," px",v=>{ TH.blur=v; }));
  }
  const h=document.createElement("div"); h.className="hint";
  h.textContent="Стекло размывает картинку за панелями внутри приложения. Показать то, что играет в другом окне (например музыку или YouTube), обычная веб-страница не может.";
  b.appendChild(h); return b;
}
applyTheme();

/* ---------- запуск ---------- */
document.querySelectorAll(".tab").forEach(b=>{
  b.onclick=()=>{ ui.tab=b.dataset.tab; render(); window.scrollTo(0,0); };
});
$("#addBtn").onclick=openAdd;
$("#prevM").onclick=()=>{ ui.month=shiftMonth(ui.month,-1); render(); };
$("#nextM").onclick=()=>{ ui.month=shiftMonth(ui.month,+1); render(); };
$("#scrim").onclick=ev=>{ if(ev.target===$("#scrim")) dismissModal(); };
document.addEventListener("keydown",ev=>{ if(ev.key==="Escape"&&!$("#scrim").hidden) dismissModal(); });
window.addEventListener("online",()=>{ if(session) sync(); });
document.addEventListener("visibilitychange",()=>{ if(!document.hidden&&session) checkReminders(); });
setInterval(()=>{ if(session) checkReminders(); }, 5*60*1000);

async function boot(){
  try{ session=JSON.parse(LS.get(K_SESSION)||"null"); }catch(e){ session=null; }
  if(!session){ viewSignIn(); return; }
  document.body.classList.remove("auth");
  $("#view").className="wrap";
  $("#hdr").hidden=false; $("#tabbar").hidden=false;
  queueLoad(); cacheLoad(); render();
  await sync();
  fetchCbuRate();
  fillRates().then(r=>{ if(r&&r.done) toast("Курс на дату проставлен старым записям: "+r.done); });
}
boot();
let aiTick=0;
setInterval(()=>{
  if(!session || document.hidden) return;
  aiTick++; if(ui.tab==="ai" || aiTick%6===0) aiPull();
},10000);

if("serviceWorker" in navigator && location.protocol.startsWith("http")){
  window.addEventListener("load",()=>{
    navigator.serviceWorker.register("./sw.js").then(reg=>{
      if("periodicSync" in reg){
        reg.periodicSync.register("ezh-daily",{minInterval:12*60*60*1000}).catch(()=>{});
      }
    }).catch(()=>{});
  });
}
</script>
</body>
</html>
